<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipa · Apito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0C; --panel:#161618; --panel-2:#1E1E20;
    --lime:#D6FF3F; --lime-dim: rgba(214,255,63,0.14);
    --orange:#FF5A36;
    --line: rgba(255,255,255,0.08); --line-strong: rgba(255,255,255,0.16);
    --text-0:#F5F5F0; --text-1: rgba(245,245,240,0.58); --text-2: rgba(245,245,240,0.34);
  }
  html[data-theme="light"]{
    --ink:#F7F7F2; --panel:#FFFFFF; --panel-2:#F0F0EC;
    --lime:#7EA300; --lime-dim: rgba(126,163,0,0.12);
    --orange:#E14A26;
    --line: rgba(0,0,0,0.08); --line-strong: rgba(0,0,0,0.16);
    --text-0:#141412; --text-1: rgba(20,20,18,0.62); --text-2: rgba(20,20,18,0.38);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background: var(--ink); color: var(--text-0); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing: antialiased; }
  a{ color:inherit; text-decoration:none; }
  .shell{ max-width: 820px; margin: 0 auto; padding: 20px; }
  .back{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color: var(--text-1); margin-bottom:16px; }

  .team-header{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .team-header img, .team-header .crest-fallback{ width:56px; height:56px; border-radius:14px; background: var(--panel); border:1px solid var(--line); object-fit:contain; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; flex-shrink:0; }
  .team-header .name{ font-family:'Archivo Black', sans-serif; font-size: clamp(18px,4vw,24px); }
  .team-header .country{ font-size:11px; color: var(--text-2); text-transform:uppercase; letter-spacing:0.5px; margin-top:3px; }

  .tabs{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid var(--line); }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{ flex-shrink:0; padding:8px 14px; border-radius:100px; background: var(--panel); border:1px solid var(--line); font-size:12.5px; font-weight:600; color: var(--text-1); white-space:nowrap; cursor:pointer; }
  .tab-btn.active{ background: var(--lime); color: var(--ink); border-color:transparent; }

  .tab-content{ display:none; }
  .tab-content.active{ display:block; }

  h2{ font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:700; margin: 20px 0 10px; }
  h2:first-child{ margin-top:0; }

  .match-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .match-row:last-child{ border-bottom:none; }
  .match-row .score{ font-family:'Space Grotesk', sans-serif; font-weight:700; }

  .table-row{ display:grid; grid-template-columns: 22px 1fr 24px 26px 24px 32px; align-items:center; gap:6px; padding:8px 2px; font-size:12.5px; border-bottom:1px solid var(--line); }
  .table-row:last-child{ border-bottom:none; }
  .table-row.head{ color: var(--text-2); font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }
  .table-row.self{ background: var(--lime-dim); border-radius:8px; font-weight:700; }
  .table-row .pos{ color: var(--text-2); font-weight:700; }
  .table-row .n{ text-align:center; color: var(--text-1); }
  .table-row .pts{ text-align:center; font-weight:800; color: var(--text-0); }

  .squad-group-title{ font-size:11px; font-weight:700; color: var(--text-2); text-transform:uppercase; letter-spacing:0.5px; margin:16px 0 8px; }
  .squad-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap:10px; }
  .player-card{ background: var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .player-card .num{ font-family:'Space Grotesk', sans-serif; font-weight:800; color: var(--lime); font-size:12px; }
  .player-card .nome{ font-size:13px; font-weight:600; margin-top:4px; }
  .player-card .pais{ font-size:10.5px; color:var(--text-2); margin-top:2px; }

  .top-player-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 4px; border-bottom:1px solid var(--line); font-size:13px; }
  .top-player-row:last-child{ border-bottom:none; }
  .top-player-row .goals{ font-family:'Space Grotesk', sans-serif; font-weight:800; color: var(--lime); }

  .stat-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:8px; }
  .stat-box{ background: var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; text-align:center; }
  .stat-box .val{ font-family:'Archivo Black', sans-serif; font-size:26px; color: var(--lime); }
  .stat-box .label{ font-size:11px; color: var(--text-2); margin-top:4px; }

  .empty-note{ font-size:13px; color:var(--text-2); }

  .filter-pills{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; margin-bottom:14px; }
  .filter-pills::-webkit-scrollbar{ display:none; }
  .filter-pill{ flex-shrink:0; padding:7px 13px; border-radius:100px; background: var(--panel); border:1px solid var(--line); font-size:11.5px; font-weight:600; color: var(--text-1); white-space:nowrap; cursor:pointer; }
  .filter-pill.active{ background: var(--lime); color: var(--ink); border-color:transparent; }
  .round-group-title{ font-size:11px; font-weight:700; color: var(--text-2); text-transform:uppercase; letter-spacing:0.5px; margin:14px 0 6px; }
  .round-group-title:first-child{ margin-top:0; }
</style>
</head>
<body>
<div class="shell">
  <a class="back" href="index.html">← Voltar aos resultados</a>

  <div class="team-header" id="team-header">
    <div class="crest-fallback">—</div>
    <div>
      <div class="name">A carregar...</div>
      <div class="country"></div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="details">Detalhes</button>
    <button class="tab-btn" data-tab="matches">Jogos</button>
    <button class="tab-btn" data-tab="standings">Classificação</button>
    <button class="tab-btn" data-tab="squad">Plantel</button>
    <button class="tab-btn" data-tab="topplayers">Melhores jogadores</button>
    <button class="tab-btn" data-tab="stats">Estatísticas</button>
  </div>

  <div class="tab-content active" id="tab-details">
    <h2>Próximo jogo</h2>
    <div id="details-next"><div class="empty-note">A carregar...</div></div>
    <h2>Últimos resultados</h2>
    <div id="details-recent"><div class="empty-note">A carregar...</div></div>
  </div>

  <div class="tab-content" id="tab-matches">
    <div class="filter-pills" id="matches-view-filter">
      <button class="filter-pill active" data-view="date">Por data</button>
      <button class="filter-pill" data-view="round">Por jornada</button>
      <button class="filter-pill" data-view="team">Por adversário</button>
    </div>
    <div id="matches-content"><div class="empty-note">A carregar...</div></div>
  </div>

  <div class="tab-content" id="tab-standings">
    <h2 id="standings-title">Classificação</h2>
    <div id="standings-table"><div class="empty-note">A carregar...</div></div>
  </div>

  <div class="tab-content" id="tab-squad">
    <div class="filter-pills" id="squad-position-filter">
      <button class="filter-pill active" data-pos="Todos">Todos</button>
    </div>
    <div id="squad-content"><div class="empty-note">A carregar...</div></div>
  </div>

  <div class="tab-content" id="tab-topplayers">
    <h2>Melhores marcadores da equipa</h2>
    <div id="topplayers-content"><div class="empty-note">A carregar...</div></div>
  </div>

  <div class="tab-content" id="tab-stats">
    <h2>Resumo (últimos jogos analisados)</h2>
    <div id="stats-content"><div class="empty-note">A carregar...</div></div>
  </div>
</div>

<script>
  const root = document.documentElement;
  root.setAttribute('data-theme', localStorage.getItem('apito-theme') || 'dark');

  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const ligaParam = params.get('league');

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  function linhaJogo(j){
    const data = new Date(j.data).toLocaleDateString('pt-PT', { day:'2-digit', month:'short' });
    const temResultado = j.golosCasa !== null && j.golosCasa !== undefined;
    const golos = temResultado ? `${j.golosCasa} - ${j.golosFora}` : data;
    return `<div class="match-row"><span>${j.casa} vs ${j.fora}</span><span class="score">${golos}</span></div>`;
  }

  async function carregar(){
    if (!id){
      document.getElementById('team-header').innerHTML = '<div class="empty-note">Nenhuma equipa selecionada.</div>';
      return;
    }
    try {
      let url = `/api/team?id=${id}`;
      if (ligaParam) url += `&league=${ligaParam}`;
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      // ---- Header ----
      const eq = data.equipa;
      document.getElementById('team-header').innerHTML = `
        <img src="https://sports.bzzoiro.com/img/team/${eq.id}/?bg=transparent" alt="${eq.nome}" onerror="this.outerHTML='<div class=\\'crest-fallback\\'>${eq.nome.slice(0,2).toUpperCase()}</div>'">
        <div>
          <div class="name">${eq.nome}</div>
          <div class="country">${eq.pais || ''}${data.nomeLiga ? ' · ' + data.nomeLiga : ''}</div>
        </div>`;

      // ---- Details ----
      document.getElementById('details-next').innerHTML = data.proximos?.length
        ? linhaJogo(data.proximos[0]) : '<div class="empty-note">Sem jogos agendados.</div>';
      document.getElementById('details-recent').innerHTML = data.recentes?.length
        ? data.recentes.slice(0,5).map(linhaJogo).join('') : '<div class="empty-note">Sem resultados recentes.</div>';

      // ---- Matches (com 3 vistas: data / jornada / adversário) ----
      const todosJogos = [...(data.proximos || []), ...(data.recentes || [])];
      window._todosJogos = todosJogos; // guardado para os botões de filtro reutilizarem

      function renderMatchesView(view){
        const container = document.getElementById('matches-content');
        if (!todosJogos.length){ container.innerHTML = '<div class="empty-note">Sem jogos disponíveis.</div>'; return; }

        if (view === 'date'){
          const ordenados = [...todosJogos].sort((a,b) => new Date(a.data) - new Date(b.data));
          container.innerHTML = ordenados.map(linhaJogo).join('');
        } else if (view === 'round'){
          const porJornada = {};
          todosJogos.forEach(j => {
            const chave = j.jornada ?? 'Sem jornada';
            if (!porJornada[chave]) porJornada[chave] = [];
            porJornada[chave].push(j);
          });
          const chaves = Object.keys(porJornada).sort((a,b) => (Number(a) || 0) - (Number(b) || 0));
          container.innerHTML = chaves.map(k => `
            <div class="round-group-title">Jornada ${k}</div>
            ${porJornada[k].map(linhaJogo).join('')}`).join('');
        } else if (view === 'team'){
          const porAdversario = {};
          todosJogos.forEach(j => {
            const adversario = j.casa === eq.nome ? j.fora : j.casa;
            if (!porAdversario[adversario]) porAdversario[adversario] = [];
            porAdversario[adversario].push(j);
          });
          const nomes = Object.keys(porAdversario).sort();
          container.innerHTML = nomes.map(n => `
            <div class="round-group-title">${n}</div>
            ${porAdversario[n].map(linhaJogo).join('')}`).join('');
        }
      }

      renderMatchesView('date');
      document.querySelectorAll('#matches-view-filter .filter-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#matches-view-filter .filter-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderMatchesView(btn.dataset.view);
        });
      });

      // ---- Standings ----
      if (data.nomeLiga) document.getElementById('standings-title').textContent = `Classificação · ${data.nomeLiga}`;
      const classificacao = data.classificacao || [];
      if (classificacao.length){
        const linhas = classificacao.map(t => `
          <div class="table-row ${String(t.equipaId) === String(eq.id) ? 'self' : ''}">
            <span class="pos">${t.posicao}</span>
            <span>${t.equipa}</span>
            <span class="n">${t.jogos}</span><span class="n">${t.saldo > 0 ? '+' + t.saldo : t.saldo}</span><span class="n">${t.vitorias}</span><span class="pts">${t.pontos}</span>
          </div>`).join('');
        document.getElementById('standings-table').innerHTML = `
          <div class="table-row head"><span>#</span><span>Equipa</span><span>J</span><span>DG</span><span>V</span><span>Pts</span></div>
          ${linhas}`;
      } else {
        document.getElementById('standings-table').innerHTML = '<div class="empty-note">Classificação não disponível.</div>';
      }

      // ---- Squad (com filtro de posição) ----
      const grupos = data.plantel || {};
      const nomesGrupos = Object.keys(grupos);

      function renderSquad(filtro){
        const chavesAMostrar = filtro === 'Todos' ? nomesGrupos : nomesGrupos.filter(g => g === filtro);
        document.getElementById('squad-content').innerHTML = chavesAMostrar.length
          ? chavesAMostrar.map(g => `
            <div class="squad-group-title">${g}</div>
            <div class="squad-grid">
              ${grupos[g].map(p => `
                <div class="player-card" style="cursor:pointer" onclick="window.location.href='player.html?id=${p.id}'">
                  <div class="num">${p.numero ?? '-'}</div>
                  <div class="nome">${p.nome}</div>
                  <div class="pais">${p.pais || ''}</div>
                </div>`).join('')}
            </div>`).join('')
          : '<div class="empty-note">Plantel não disponível.</div>';
      }

      const filterContainer = document.getElementById('squad-position-filter');
      filterContainer.innerHTML = ['Todos', ...nomesGrupos].map((g, i) =>
        `<button class="filter-pill ${i === 0 ? 'active' : ''}" data-pos="${g}">${g}</button>`
      ).join('');
      renderSquad('Todos');
      filterContainer.querySelectorAll('.filter-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          filterContainer.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderSquad(btn.dataset.pos);
        });
      });

      // ---- Top players ----
      const melhores = data.melhoresJogadores || [];
      document.getElementById('topplayers-content').innerHTML = melhores.length
        ? melhores.map(p => `<div class="top-player-row"><span>${p.jogador}${p.posicao ? ' · ' + p.posicao : ''}</span><span class="goals">${p.golos}</span></div>`).join('')
        : '<div class="empty-note">Sem dados de melhores marcadores para esta equipa nesta liga.</div>';

      // ---- Stats ----
      const est = data.estatisticas;
      if (est && est.jogosAnalisados > 0){
        document.getElementById('stats-content').innerHTML = `
          <div class="stat-grid">
            <div class="stat-box"><div class="val">${est.jogosAnalisados}</div><div class="label">Jogos analisados</div></div>
            <div class="stat-box"><div class="val">${est.golosMarcados}</div><div class="label">Golos marcados</div></div>
            <div class="stat-box"><div class="val">${est.golosSofridos}</div><div class="label">Golos sofridos</div></div>
            <div class="stat-box"><div class="val">${(est.golosMarcados - est.golosSofridos) >= 0 ? '+' : ''}${est.golosMarcados - est.golosSofridos}</div><div class="label">Diferença de golos</div></div>
          </div>
          <p class="empty-note" style="margin-top:12px;">Baseado nos últimos ${est.jogosAnalisados} jogos com resultado disponível, não na época inteira.</p>`;
      } else {
        document.getElementById('stats-content').innerHTML = '<div class="empty-note">Estatísticas não disponíveis.</div>';
      }

    } catch (err) {
      document.getElementById('team-header').innerHTML = `<div class="empty-note">Não foi possível carregar: ${err.message}</div>`;
    }
  }

  carregar();
</script>
</body>
</html>
