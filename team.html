<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipa · Apito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0C; --panel:#161618; --panel-2:#1E1E20;
    --lime:#D6FF3F; --lime-dim: rgba(214,255,63,0.14);
    --orange:#FF5A36;
    --line: rgba(255,255,255,0.08);
    --text-0:#F5F5F0; --text-1: rgba(245,245,240,0.58); --text-2: rgba(245,245,240,0.34);
  }
  html[data-theme="light"]{
    --ink:#F7F7F2; --panel:#FFFFFF; --panel-2:#F0F0EC;
    --lime:#7EA300; --lime-dim: rgba(126,163,0,0.12);
    --orange:#E14A26;
    --line: rgba(0,0,0,0.08);
    --text-0:#141412; --text-1: rgba(20,20,18,0.62); --text-2: rgba(20,20,18,0.38);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background: var(--ink); color: var(--text-0); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing: antialiased; }
  a{ color:inherit; text-decoration:none; }
  .shell{ max-width: 780px; margin: 0 auto; padding: 24px; }
  .back{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color: var(--text-1); margin-bottom:20px; }

  .team-header{ display:flex; align-items:center; gap:16px; margin-bottom:28px; }
  .team-header img, .team-header .crest-fallback{ width:64px; height:64px; border-radius:14px; background: var(--panel); border:1px solid var(--line); object-fit:contain; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:20px; }
  .team-header .name{ font-family:'Archivo Black', sans-serif; font-size: clamp(20px,4vw,28px); }
  .team-header .country{ font-size:12px; color: var(--text-2); text-transform:uppercase; letter-spacing:0.5px; margin-top:4px; }

  h2{ font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:700; margin: 26px 0 12px; }

  .match-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 4px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .match-row:last-child{ border-bottom:none; }
  .match-row .score{ font-family:'Space Grotesk', sans-serif; font-weight:700; }

  .squad-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap:10px; }
  .player-card{ background: var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .player-card .num{ font-family:'Space Grotesk', sans-serif; font-weight:800; color: var(--lime); font-size:12px; }
  .player-card .nome{ font-size:13px; font-weight:600; margin-top:4px; }
  .player-card .pos{ font-size:10.5px; color:var(--text-2); margin-top:2px; }

  .empty-note{ font-size:13px; color:var(--text-2); }
</style>
</head>
<body>
<div class="shell">
  <a class="back" href="index.html">← Voltar aos resultados</a>

  <div class="team-header" id="team-header">
    <div class="crest-fallback">—</div>
    <div>
      <div class="name">A carregar...</div>
      <div class="country"></div>
    </div>
  </div>

  <h2>Próximos jogos</h2>
  <div id="proximos"><div class="empty-note">A carregar...</div></div>

  <h2>Últimos resultados</h2>
  <div id="recentes"><div class="empty-note">A carregar...</div></div>

  <h2>Plantel</h2>
  <div class="squad-grid" id="squad"><div class="empty-note">A carregar...</div></div>
</div>

<script>
  const root = document.documentElement;
  root.setAttribute('data-theme', localStorage.getItem('apito-theme') || 'dark');

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  function linhaJogo(j){
    const data = new Date(j.data).toLocaleDateString('pt-PT', { day:'2-digit', month:'short' });
    const golos = (j.golosCasa !== null && j.golosCasa !== undefined) ? `${j.golosCasa} - ${j.golosFora}` : data;
    return `<div class="match-row"><span>${j.casa} vs ${j.fora}</span><span class="score">${golos}</span></div>`;
  }

  async function carregar(){
    if (!id){
      document.getElementById('team-header').innerHTML = '<div class="empty-note">Nenhuma equipa selecionada.</div>';
      return;
    }
    try {
      const resp = await fetch(`/api/team?id=${id}`);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      const eq = data.equipa;
      document.getElementById('team-header').innerHTML = `
        <img src="https://sports.bzzoiro.com/img/team/${eq.id}/?bg=transparent" alt="${eq.nome}" onerror="this.outerHTML='<div class=\\'crest-fallback\\'>${eq.nome.slice(0,2).toUpperCase()}</div>'">
        <div>
          <div class="name">${eq.nome}</div>
          <div class="country">${eq.pais || ''}</div>
        </div>`;

      document.getElementById('proximos').innerHTML = data.proximos?.length
        ? data.proximos.map(linhaJogo).join('')
        : '<div class="empty-note">Sem jogos agendados.</div>';

      document.getElementById('recentes').innerHTML = data.recentes?.length
        ? data.recentes.map(linhaJogo).join('')
        : '<div class="empty-note">Sem resultados recentes.</div>';

      document.getElementById('squad').innerHTML = data.plantel?.length
        ? data.plantel.map(p => `
          <div class="player-card">
            <div class="num">${p.numero ?? '-'}</div>
            <div class="nome">${p.nome}</div>
            <div class="pos">${p.posicao || ''}</div>
          </div>`).join('')
        : '<div class="empty-note">Plantel não disponível.</div>';

    } catch (err) {
      document.getElementById('team-header').innerHTML = `<div class="empty-note">Não foi possível carregar: ${err.message}</div>`;
    }
  }

  carregar();
</script>
</body>
</html>
