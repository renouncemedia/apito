<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Liga · Apito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0C; --card:#1A1726; --card-2:#221E30;
    --line: rgba(255,255,255,0.08); --line-strong: rgba(255,255,255,0.16);
    --white:#FFFFFF; --text-0:#F2F2F3; --text-1: rgba(242,242,243,0.58); --text-2: rgba(242,242,243,0.34);
    --live:#FF3B5C; --blue:#3B82F6; --red-stat:#FF5A5A; --lime:#C6FF3D; --lime-dim: rgba(198,255,61,0.14); --purple:#7C5CFC; --purple-dim: rgba(124,92,252,0.16);
  }
  html[data-theme="light"]{
    --bg:#F4F4F6; --card:#FFFFFF; --card-2:#F0F0F3;
    --line: rgba(0,0,0,0.08); --line-strong: rgba(0,0,0,0.16);
    --white:#111114; --text-0:#111114; --text-1: rgba(17,17,20,0.62); --text-2: rgba(17,17,20,0.38);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background: var(--bg); color: var(--text-0); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; appearance:none; -webkit-appearance:none; }
  .shell{ max-width:1000px; margin:0 auto; padding:24px; } @media (max-width:640px){ .shell{ padding:14px; } }
  .back{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color: var(--text-1); margin-bottom:16px; }

  .league-header{ display:flex; align-items:center; gap:16px; margin-bottom:20px; }
  .league-header img, .league-header .crest-fallback{ width:60px; height:60px; border-radius:16px; background: var(--card); border:1px solid var(--line); object-fit:contain; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:17px; flex-shrink:0; }
  .league-header .name{ font-size: clamp(19px,4vw,25px); font-weight:800; }
  .league-header .country{ font-size:11px; color: var(--text-2); text-transform:uppercase; letter-spacing:0.5px; margin-top:4px; }

  .tabs{ display:flex; gap:22px; overflow-x:auto; scrollbar-width:none; padding-bottom:14px; margin-bottom:18px; border-bottom:1px solid var(--line); position:sticky; top:0; background: var(--bg); z-index:10; padding-top:6px; }
  .tab-content{ animation: fadeIn .18s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--lime); outline-offset:2px; border-radius:6px; }
  .breadcrumb{ font-size:12px; color: var(--text-2); margin-bottom:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .breadcrumb a{ color: var(--text-1); }
  .breadcrumb a:hover{ color: var(--text-0); text-decoration:underline; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{ appearance:none; -webkit-appearance:none; flex-shrink:0; padding:2px 0 12px; font-size:13.5px; font-weight:600; color: var(--text-2); white-space:nowrap; cursor:pointer; position:relative; }
  .tab-btn.active{ color: var(--text-0); }
  .tab-btn.active::after{ content:""; position:absolute; left:0; right:0; bottom:-15px; height:2px; background: var(--white); }
  .tab-content{ display:none; }
  .tab-content.active{ display:block; }

  h2{ font-size:14.5px; font-weight:700; margin:18px 0 10px; }
  h2:first-child{ margin-top:0; }

  .featured-card{ background: var(--card); border:1px solid var(--line-strong); border-radius:16px; padding:20px; text-align:center; cursor:pointer; }
  .featured-card .when{ font-size:11px; color: var(--text-2); }
  .featured-card .teams{ font-size:18px; font-weight:800; margin-top:6px; }

  .zone-bar{ width:3px; height:20px; border-radius:2px; }
  .zone-bar.z1{ background: var(--blue); }
  .zone-bar.z2{ background:#3B82F6; }
  .zone-bar.z3{ background:#14B8A6; }
  .table-row{ display:grid; grid-template-columns:4px 18px 1fr 22px 24px 22px 28px; align-items:center; gap:6px; padding:8px 2px; font-size:12.5px; border-bottom:1px solid var(--line); }
  .table-row:last-child{ border-bottom:none; }
  .table-row.head{ color: var(--text-2); font-size:9px; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }
  .table-row .pos{ color: var(--text-2); font-weight:700; }
  .table-row .n{ text-align:center; color: var(--text-1); }
  .table-row .pts{ text-align:center; font-weight:800; }
  .table-row .club{ cursor:pointer; }

  .card{ background: var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h3{ font-size:13.5px; font-weight:700; margin-bottom:10px; }
  .stat-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .stat-row:last-child{ border-bottom:none; }
  .stat-row .val{ font-weight:800; color: var(--lime); }

  .filter-pills{ display:flex; gap:6px; margin-bottom:12px; }
  .filter-pill{ appearance:none; -webkit-appearance:none; padding:7px 13px; border-radius:100px; background: var(--card); border:1px solid var(--line); font-size:11.5px; font-weight:600; color: var(--text-1); cursor:pointer; }
  .filter-pill.active{ background: var(--white); color: var(--bg); border-color:transparent; }

  .empty-note{ font-size:13px; color: var(--text-2); padding:6px 0; }

  /* ---------- Shell de navegação (partilhada com index.html) ---------- */
  :root{ --sidebar-w: 240px; --bottomnav-h: 64px; }
  .app-shell{ display:flex; min-height:100vh; }
  .sidebar{ width: var(--sidebar-w); flex-shrink:0; background: var(--bg-2); border-right:1px solid var(--line); padding:22px 16px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .sidebar .brand{ display:flex; align-items:center; gap:10px; padding:0 8px; margin-bottom:28px; }
  .sidebar .brand .mark{ width:32px; height:32px; border-radius:9px; background: var(--lime); display:flex; align-items:center; justify-content:center; }
  .sidebar .brand .mark::before{ content:""; width:13px; height:13px; background:#0D0B14; clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
  .sidebar .brand .name{ font-weight:800; font-size:18px; }
  .nav-item{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; font-size:13.5px; font-weight:600; color: var(--text-1); margin-bottom:3px; min-height:44px; }
  .nav-item svg{ width:18px; height:18px; opacity:0.8; flex-shrink:0; }
  .nav-item.active{ background: var(--lime-dim); color: var(--lime); }
  .nav-item:hover:not(.active){ background: var(--card-2); color: var(--text-0); }
  .sidebar-promo{ margin-top:auto; background: linear-gradient(150deg, var(--purple), #5B3FE0); border-radius:16px; padding:16px; }
  .sidebar-promo .title{ font-size:13px; font-weight:800; line-height:1.3; }
  .sidebar-promo .sub{ font-size:11px; opacity:0.8; margin-top:4px; }
  .sidebar-promo .cta{ display:inline-block; margin-top:12px; background:#fff; color:#161022; font-size:11.5px; font-weight:800; padding:8px 14px; border-radius:100px; }
  @media (max-width: 1023px){ .sidebar{ display:none; } }

  .main-area{ flex:1; min-width:0; padding-bottom: 24px; }
  

  .bottom-nav{ display:none; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" aria-label="Navegação principal">
    <div class="brand"><div class="mark"></div><span class="name">Apito</span></div>
    <a href="index.html" class="nav-item " id="nav-inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Início</a>
    <a href="index.html?filtro=ao-vivo" class="nav-item " id="nav-ao-vivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>Ao vivo</a>
    <a href="index.html?filtro=favoritos" class="nav-item " id="nav-favoritos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17.3l-6.2 3.6 1.6-7-5.4-4.7 7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7z"/></svg>Favoritos</a>
    <button class="nav-item" id="nav-tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Tema</button>
    <div class="sidebar-promo">
      <div class="title">Apito PRO</div>
      <div class="sub">Estatísticas avançadas e sem limites de pedidos.</div>
      <div class="cta">Em breve</div>
    </div>
  </nav>

  <div class="main-area">
<div class="shell">
  <a class="back" href="index.html">← Voltar aos resultados</a>
  <div class="breadcrumb"><a href="index.html">Início</a> / <span id="breadcrumb-liga">Liga</span></div>

  <div class="league-header" id="league-header">
    <div class="crest-fallback">—</div>
    <div><div class="name">A carregar...</div><div class="country"></div></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="overview">Visão geral</button>
    <button class="tab-btn" data-tab="standings">Classificação</button>
    <button class="tab-btn" data-tab="stats">Estatísticas</button>
  </div>

  <div class="tab-content active" id="tab-overview">
    <h2>Próximo jogo</h2>
    <div id="overview-featured"><div class="empty-note">A carregar...</div></div>
    <h2>Época</h2>
    <div id="overview-season"><div class="empty-note">A carregar...</div></div>
  </div>

  <div class="tab-content" id="tab-standings">
    <h2>Classificação</h2>
    <div class="filter-pills" id="venue-filter">
      <button class="filter-pill active" data-venue="all">Tudo</button>
      <button class="filter-pill" data-venue="home">Casa</button>
      <button class="filter-pill" data-venue="away">Fora</button>
    </div>
    <div class="card" id="standings-table"><div class="empty-note">A carregar...</div></div>
  </div>

  <div class="tab-content" id="tab-stats">
    <div id="stats-content"><div class="empty-note">A carregar...</div></div>
  </div>
</div>

<script>
  const root = document.documentElement;
  root.setAttribute('data-theme', localStorage.getItem('apito-theme') || 'dark');

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    });
  });

  async function carregar(venue){
    if (!id){
      document.getElementById('league-header').innerHTML = '<div class="empty-note">Nenhuma liga selecionada.</div>';
      return;
    }
    try {
      const urlVenue = venue && venue !== 'all' ? `&venue=${venue}` : '';
      const resp = await fetch(`/api/league?id=${id}${urlVenue}`);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      const liga = data.liga;
      document.getElementById('breadcrumb-liga').textContent = liga.nome;
      document.getElementById('league-header').innerHTML = `
        <img src="https://sports.bzzoiro.com/img/league/${liga.id}/?bg=transparent" alt="${liga.nome}" onerror="this.outerHTML='<div class=\\'crest-fallback\\'>${liga.nome.slice(0,2).toUpperCase()}</div>'">
        <div><div class="name">${liga.nome}</div><div class="country">${liga.pais || ''}</div></div>`;

      if (data.proximoJogo){
        const d = new Date(data.proximoJogo.data);
        document.getElementById('overview-featured').innerHTML = `
          <div class="featured-card" onclick="window.location.href='detail.html?id=${data.proximoJogo.id}'">
            <div class="when">Próximo jogo</div>
            <div class="teams">${data.proximoJogo.casa} vs ${data.proximoJogo.fora}</div>
            <div class="when">${d.toLocaleDateString('pt-PT',{weekday:'short',day:'2-digit',month:'short'})} · ${d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}</div>
          </div>`;
      } else {
        document.getElementById('overview-featured').innerHTML = '<div class="empty-note">Sem jogos agendados de momento.</div>';
      }

      if (data.season){
        document.getElementById('overview-season').innerHTML = `<div class="empty-note">${data.season.nome} · ${new Date(data.season.inicio).toLocaleDateString('pt-PT')} a ${new Date(data.season.fim).toLocaleDateString('pt-PT')}</div>`;
      } else {
        document.getElementById('overview-season').innerHTML = '<div class="empty-note">Informação da época não disponível.</div>';
      }

      const classificacao = data.classificacao || [];
      if (classificacao.length){
        const linhas = classificacao.map(t => {
          const zona = t.posicao<=3 ? 'z1' : t.posicao<=6 ? 'z2' : t.posicao<=7 ? 'z3' : '';
          return `<div class="table-row">
            <span class="zone-bar ${zona}"></span><span class="pos">${t.posicao}</span>
            <span class="club" onclick="window.location.href='team.html?id=${t.equipaId}&league=${id}'">${t.equipa}</span>
            <span class="n">${t.jogos}</span><span class="n">${t.saldo>0?'+'+t.saldo:t.saldo}</span><span class="n">${t.vitorias}</span><span class="pts">${t.pontos}</span>
          </div>`;
        }).join('');
        document.getElementById('standings-table').innerHTML = `<div class="table-row head"><span></span><span>#</span><span>Equipa</span><span>J</span><span>DG</span><span>V</span><span>Pts</span></div>${linhas}`;
      } else {
        document.getElementById('standings-table').innerHTML = '<div class="empty-note">Classificação não disponível.</div>';
      }

      const est = data.estatisticas || {};
      const categoriasComDados = Object.values(est).filter(c => c.dados && c.dados.length);
      document.getElementById('stats-content').innerHTML = categoriasComDados.length
        ? categoriasComDados.map(c => `
          <div class="card"><h3>${c.titulo}</h3>
            ${c.dados.map(p => `<div class="stat-row"><span>${p.jogador} <span style="color:var(--text-2)">· ${p.equipa}</span></span><span class="val">${p.valor}</span></div>`).join('')}
          </div>`).join('')
        : '<div class="empty-note">Estatísticas não disponíveis para esta liga.</div>';

    } catch (err) {
      document.getElementById('league-header').innerHTML = `<div class="empty-note">Não foi possível carregar: ${err.message}</div>`;
    }
  }

  carregar('all');
  document.querySelectorAll('#venue-filter .filter-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#venue-filter .filter-pill').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('standings-table').innerHTML = '<div class="empty-note">A carregar...</div>';
      carregar(btn.dataset.venue);
    });
  });
</script>
  </div>
</div>


</body>
</html>
