<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga · Apito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0C; --panel:#161618; --panel-2:#1E1E20;
    --lime:#D6FF3F; --lime-dim: rgba(214,255,63,0.14);
    --orange:#FF5A36;
    --line: rgba(255,255,255,0.08);
    --text-0:#F5F5F0; --text-1: rgba(245,245,240,0.58); --text-2: rgba(245,245,240,0.34);
  }
  html[data-theme="light"]{
    --ink:#F7F7F2; --panel:#FFFFFF; --panel-2:#F0F0EC;
    --lime:#7EA300; --lime-dim: rgba(126,163,0,0.12);
    --orange:#E14A26;
    --line: rgba(0,0,0,0.08);
    --text-0:#141412; --text-1: rgba(20,20,18,0.62); --text-2: rgba(20,20,18,0.38);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background: var(--ink); color: var(--text-0); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing: antialiased; }
  a{ color:inherit; text-decoration:none; }
  .shell{ max-width: 820px; margin: 0 auto; padding: 20px; }
  .back{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color: var(--text-1); margin-bottom:16px; }

  .league-header{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .league-header img, .league-header .crest-fallback{ width:56px; height:56px; border-radius:14px; background: var(--panel); border:1px solid var(--line); object-fit:contain; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex-shrink:0; }
  .league-header .name{ font-family:'Archivo Black', sans-serif; font-size: clamp(18px,4vw,24px); }
  .league-header .country{ font-size:11px; color: var(--text-2); text-transform:uppercase; letter-spacing:0.5px; margin-top:3px; }

  .tabs{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid var(--line); }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{ flex-shrink:0; padding:8px 14px; border-radius:100px; background: var(--panel); border:1px solid var(--line); font-size:12.5px; font-weight:600; color: var(--text-1); white-space:nowrap; cursor:pointer; }
  .tab-btn.active{ background: var(--lime); color: var(--ink); border-color:transparent; }
  .tab-content{ display:none; }
  .tab-content.active{ display:block; }

  h2{ font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:700; margin: 20px 0 10px; }
  h2:first-child{ margin-top:0; }

  .featured-card{ background: linear-gradient(120deg, var(--orange), #FF7A4D); border-radius:16px; padding:18px; color:#17110B; text-align:center; cursor:pointer; }
  .featured-card .teams{ font-family:'Archivo Black', sans-serif; font-size:18px; margin-top:4px; }
  .featured-card .when{ font-size:11px; opacity:0.75; margin-top:4px; }

  .table-row{ display:grid; grid-template-columns: 22px 1fr 24px 26px 24px 32px; align-items:center; gap:6px; padding:8px 2px; font-size:12.5px; border-bottom:1px solid var(--line); }
  .table-row:last-child{ border-bottom:none; }
  .table-row.head{ color: var(--text-2); font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }
  .table-row .pos{ color: var(--text-2); font-weight:700; }
  .table-row .n{ text-align:center; color: var(--text-1); }
  .table-row .pts{ text-align:center; font-weight:800; color: var(--text-0); }
  .table-row .club{ cursor:pointer; }

  .stat-card{ background: var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .stat-card h3{ font-family:'Space Grotesk', sans-serif; font-size:13.5px; margin-bottom:10px; }
  .stat-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .stat-row:last-child{ border-bottom:none; }
  .stat-row .val{ font-family:'Space Grotesk', sans-serif; font-weight:800; color: var(--lime); }

  .empty-note{ font-size:13px; color:var(--text-2); }
</style>
</head>
<body>
<div class="shell">
  <a class="back" href="index.html">← Voltar aos resultados</a>

  <div class="league-header" id="league-header">
    <div class="crest-fallback">—</div>
    <div>
      <div class="name">A carregar...</div>
      <div class="country"></div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="overview">Visão geral</button>
    <button class="tab-btn" data-tab="standings">Classificação</button>
    <button class="tab-btn" data-tab="stats">Estatísticas</button>
  </div>

  <div class="tab-content active" id="tab-overview">
    <h2>Próximo jogo</h2>
    <div id="overview-featured"><div class="empty-note">A carregar...</div></div>
    <h2>Época</h2>
    <div id="overview-season"><div class="empty-note">A carregar...</div></div>
  </div>

  <div class="tab-content" id="tab-standings">
    <h2>Classificação</h2>
    <div id="standings-table"><div class="empty-note">A carregar...</div></div>
  </div>

  <div class="tab-content" id="tab-stats">
    <div id="stats-content"><div class="empty-note">A carregar...</div></div>
  </div>
</div>

<script>
  const root = document.documentElement;
  root.setAttribute('data-theme', localStorage.getItem('apito-theme') || 'dark');

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });

  async function carregar(){
    if (!id){
      document.getElementById('league-header').innerHTML = '<div class="empty-note">Nenhuma liga selecionada.</div>';
      return;
    }
    try {
      const resp = await fetch(`/api/league?id=${id}`);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      const liga = data.liga;
      document.getElementById('league-header').innerHTML = `
        <img src="https://sports.bzzoiro.com/img/league/${liga.id}/?bg=transparent" alt="${liga.nome}" onerror="this.outerHTML='<div class=\\'crest-fallback\\'>${liga.nome.slice(0,2).toUpperCase()}</div>'">
        <div><div class="name">${liga.nome}</div><div class="country">${liga.pais || ''}</div></div>`;

      // ---- Overview ----
      if (data.proximoJogo){
        const d = new Date(data.proximoJogo.data);
        document.getElementById('overview-featured').innerHTML = `
          <div class="featured-card" onclick="window.location.href='detail.html?id=${data.proximoJogo.id}'">
            <div class="when">Próximo jogo</div>
            <div class="teams">${data.proximoJogo.casa} vs ${data.proximoJogo.fora}</div>
            <div class="when">${d.toLocaleDateString('pt-PT', { weekday:'short', day:'2-digit', month:'short' })} · ${d.toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' })}</div>
          </div>`;
      } else {
        document.getElementById('overview-featured').innerHTML = '<div class="empty-note">Sem jogos agendados de momento.</div>';
      }

      if (data.season){
        document.getElementById('overview-season').innerHTML = `
          <div class="empty-note">${data.season.nome} · ${new Date(data.season.inicio).toLocaleDateString('pt-PT')} a ${new Date(data.season.fim).toLocaleDateString('pt-PT')}</div>`;
      } else {
        document.getElementById('overview-season').innerHTML = '<div class="empty-note">Informação da época não disponível.</div>';
      }

      // ---- Standings ----
      const classificacao = data.classificacao || [];
      if (classificacao.length){
        const linhas = classificacao.map(t => `
          <div class="table-row">
            <span class="pos">${t.posicao}</span>
            <span class="club" onclick="window.location.href='team.html?id=${t.equipaId}&league=${id}'">${t.equipa}</span>
            <span class="n">${t.jogos}</span><span class="n">${t.saldo > 0 ? '+' + t.saldo : t.saldo}</span><span class="n">${t.vitorias}</span><span class="pts">${t.pontos}</span>
          </div>`).join('');
        document.getElementById('standings-table').innerHTML = `
          <div class="table-row head"><span>#</span><span>Equipa</span><span>J</span><span>DG</span><span>V</span><span>Pts</span></div>
          ${linhas}`;
      } else {
        document.getElementById('standings-table').innerHTML = '<div class="empty-note">Classificação não disponível.</div>';
      }

      // ---- Stats ----
      const est = data.estatisticas || {};
      const categoriasComDados = Object.values(est).filter(c => c.dados && c.dados.length);
      document.getElementById('stats-content').innerHTML = categoriasComDados.length
        ? categoriasComDados.map(c => `
          <div class="stat-card">
            <h3>${c.titulo}</h3>
            ${c.dados.map(p => `<div class="stat-row"><span>${p.jogador} <span style="color:var(--text-2)">· ${p.equipa}</span></span><span class="val">${p.valor}</span></div>`).join('')}
          </div>`).join('')
        : '<div class="empty-note">Estatísticas não disponíveis para esta liga.</div>';

    } catch (err) {
      document.getElementById('league-header').innerHTML = `<div class="empty-note">Não foi possível carregar: ${err.message}</div>`;
    }
  }

  carregar();
</script>
</body>
</html>
