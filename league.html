<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Liga · Apito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Big+Shoulders+Display:wght@500;700;800;900&family=Big+Shoulders+Text:wght@500;600;700&display=swap" rel="stylesheet">
<!-- APITO V2 — canonical foundation tokens, shared by all five pages. See assets/foundation.css -->
<link rel="stylesheet" href="assets/foundation.css">
<!-- APITO V2 — canonical shell/navigation (sidebar, topbar, bottom-nav). See assets/shell.css / assets/shell.js -->
<link rel="stylesheet" href="assets/shell.css">
<script src="assets/shell.js"></script>
<!-- APITO V2 — canonical shared components (Pass 3A: MatchRow). See assets/components.css / assets/components.js -->
<link rel="stylesheet" href="assets/components.css">
<script src="assets/components.js"></script>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background: var(--bg); color: var(--text-0); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; appearance:none; -webkit-appearance:none; }
  .shell{ max-width:1000px; margin:0 auto; padding:24px; } @media (max-width:640px){ .shell{ padding:14px; } }
  .back{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color: var(--text-1); margin-bottom:16px; }

  /* .league-header is now the canonical EntityHero component (Entity
     Gradient) shared in assets/components.css — see Pass 3B. */

  .tabs{ display:flex; gap:22px; overflow-x:auto; scrollbar-width:none; padding-bottom:14px; margin-bottom:18px; border-bottom:1px solid var(--line); position:sticky; top:0; background: var(--bg); z-index:10; padding-top:6px; }
  .tab-content{ animation: fadeIn .18s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--lime); outline-offset:2px; border-radius:6px; }
  .breadcrumb{ font-size:12px; color: var(--text-2); margin-bottom:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .breadcrumb a{ color: var(--text-1); }
  .breadcrumb a:hover{ color: var(--text-0); text-decoration:underline; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{ appearance:none; -webkit-appearance:none; flex-shrink:0; padding:2px 0 12px; font-size:13.5px; font-weight:600; color: var(--text-2); white-space:nowrap; cursor:pointer; position:relative; }
  .tab-btn.active{ color: var(--text-0); }
  .tab-btn.active::after{ content:""; position:absolute; left:0; right:0; bottom:-15px; height:2px; background: var(--white); }
  .tab-content{ display:none; }
  .tab-content.active{ display:block; }

  h2{ font-size:14.5px; font-weight:700; margin:18px 0 10px; }
  h2:first-child{ margin-top:0; }

  .featured-card{ background: linear-gradient(135deg, #C6FF3D 0%, #7ED957 45%, #16A34A 100%); border:1px solid transparent; border-radius:16px; padding:20px; text-align:center; cursor:pointer; color:#0D2A0F; }
  .featured-card .when{ font-size:11px; color: rgba(13,42,15,0.7); }
  .featured-card .teams{ font-size:18px; font-weight:800; margin-top:6px; color:#0D2A0F; }

  /* Standings table is now the canonical DataTable/StandingsTable
     component in assets/components.css (fixes zone-color drift).
     Filter pills are now the canonical Chip component (.chip). */

  .card{ background: var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .card h3{ font-size:13.5px; font-weight:700; margin-bottom:10px; }
  .stat-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .stat-row:last-child{ border-bottom:none; }
  .stat-row .val{ font-weight:800; color: var(--lime); }

  .filter-pills{ display:flex; gap:6px; margin-bottom:12px; }

  /* .empty-note is now canonical in assets/components.css */

  /* Shell/navigation (sidebar, topbar chrome, bottom-nav) now lives in
     assets/shell.css, shared by all five pages — see Pass 2. */
</style>
</head>
<body>
<div class="app-shell">
  <!-- Sidebar (desktop) — canonical markup rendered by assets/shell.js, shared by all five pages -->
  <script>ApitoShell.renderSidebar();</script>

  <!-- Bottom navigation (mobile, persistent) — canonical markup rendered by assets/shell.js -->
  <script>ApitoShell.renderBottomNav();</script>

  <div class="main-area">
<div class="shell">
  <!-- Topbar — canonical markup rendered by assets/shell.js -->
  <script>ApitoShell.renderTopbar();</script>

  <a class="back" href="index.html">← Voltar aos resultados</a>
  <div class="breadcrumb"><a href="index.html">Início</a> / <span id="breadcrumb-liga">Liga</span></div>

  <div class="league-header" id="league-header">
    <div class="crest-fallback">—</div>
    <div><div class="name">A carregar...</div><div class="country"></div></div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="overview">Visão geral</button>
    <button class="tab-btn" data-tab="jogos">Jogos</button>
    <button class="tab-btn" data-tab="standings">Classificação</button>
    <button class="tab-btn" data-tab="stats">Estatísticas</button>
  </div>

  <div class="tab-content active" id="tab-overview">
    <h2 id="overview-jornada-title">Próximo jogo</h2>
    <div id="overview-featured"><div class="empty-note">A carregar...</div></div>
    <h2>Época</h2>
    <div id="overview-season"><div class="empty-note">A carregar...</div></div>
  </div>

  <div class="tab-content" id="tab-jogos">
    <div class="filter-pills" id="jogos-view-filter">
      <button class="chip active" data-view="proximos">Próximos</button>
      <button class="chip" data-view="recentes">Resultados recentes</button>
    </div>
    <div class="card" id="jogos-content"><div class="empty-note">A carregar...</div></div>
  </div>

  <div class="tab-content" id="tab-standings">
    <h2>Classificação</h2>
    <div class="filter-pills" id="venue-filter">
      <button class="chip active" data-venue="all">Tudo</button>
      <button class="chip" data-venue="home">Casa</button>
      <button class="chip" data-venue="away">Fora</button>
    </div>
    <div class="card" id="standings-table"><div class="empty-note">A carregar...</div></div>
  </div>

  <div class="tab-content" id="tab-stats">
    <div id="stats-content"><div class="empty-note">A carregar...</div></div>
  </div>
</div>

<script>
  // Theme state is applied by assets/shell.js before this script runs —
  // no per-page initialization needed here (see Pass 2).

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    });
  });

  async function carregar(venue){
    if (!id){
      document.getElementById('league-header').innerHTML = '<div class="empty-note">Nenhuma liga selecionada.</div>';
      return;
    }
    try {
      const urlVenue = venue && venue !== 'all' ? `&venue=${venue}` : '';
      const resp = await fetch(`/api/league?id=${id}${urlVenue}`);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      const liga = data.liga;
      document.getElementById('breadcrumb-liga').textContent = liga.nome;
      document.getElementById('league-header').innerHTML = `
        <img src="https://sports.bzzoiro.com/img/league/${liga.id}/?bg=transparent" alt="${liga.nome}" onerror="this.outerHTML='<div class=\\'crest-fallback\\'>${liga.nome.slice(0,2).toUpperCase()}</div>'">
        <div><div class="name">${liga.nome}</div><div class="country">${liga.pais || ''}</div></div>`;

      if (data.proximaJornada){
        document.getElementById('overview-jornada-title').textContent = `Jornada ${data.proximaJornada} · Próximo jogo`;
      }

      if (data.proximoJogo){
        const d = new Date(data.proximoJogo.data);
        document.getElementById('overview-featured').innerHTML = `
          <div class="featured-card" onclick="window.location.href='detail.html?id=${data.proximoJogo.id}'">
            <div class="when">Próximo jogo</div>
            <div class="teams">${data.proximoJogo.casa} vs ${data.proximoJogo.fora}</div>
            <div class="when">${d.toLocaleDateString('pt-PT',{weekday:'short',day:'2-digit',month:'short'})} · ${d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'})}</div>
          </div>`;
      } else {
        document.getElementById('overview-featured').innerHTML = '<div class="empty-note">Sem jogos agendados de momento.</div>';
      }

      // ---- Tab "Jogos": todos os próximos e resultados recentes ----
      // Canonical Compact MatchRow (assets/components.js) — this list has
      // no team IDs in its data, so crests render as initials-fallback and
      // team names aren't individually clickable, same as V1's behavior.
      function linhaJogoLiga(j){
        const temResultado = j.golosCasa !== null && j.golosCasa !== undefined;
        const match = {
          id: j.id,
          status: temResultado ? 'FT' : 'NS',
          kickoff: j.data,
          home: { name: j.casa, goals: temResultado ? j.golosCasa : null },
          away: { name: j.fora, goals: temResultado ? j.golosFora : null }
        };
        return ApitoComponents.matchRow(match, { density: 'compact' });
      }
      function renderJogosLiga(view){
        const lista = view === 'recentes' ? (data.recentesJogos || []) : (data.proximosJogos || []);
        document.getElementById('jogos-content').innerHTML = lista.length
          ? lista.map(linhaJogoLiga).join('')
          : `<div class="empty-note">Sem jogos ${view === 'recentes' ? 'recentes' : 'agendados'} para mostrar.</div>`;
      }
      renderJogosLiga('proximos');
      document.querySelectorAll('#jogos-view-filter .chip').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#jogos-view-filter .chip').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderJogosLiga(btn.dataset.view);
        });
      });

      if (data.season){
        document.getElementById('overview-season').innerHTML = `<div class="empty-note">${data.season.nome} · ${new Date(data.season.inicio).toLocaleDateString('pt-PT')} a ${new Date(data.season.fim).toLocaleDateString('pt-PT')}</div>`;
      } else {
        document.getElementById('overview-season').innerHTML = '<div class="empty-note">Informação da época não disponível.</div>';
      }

      const classificacao = data.classificacao || [];
      if (classificacao.length){
        const linhas = classificacao.map(t => ApitoComponents.standingsRow(t, { leagueId: id })).join('');
        document.getElementById('standings-table').innerHTML = `${ApitoComponents.standingsHeader()}${linhas}`;
      } else {
        document.getElementById('standings-table').innerHTML = '<div class="empty-note">Classificação não disponível.</div>';
      }

      const est = data.estatisticas || {};
      const categoriasComDados = Object.values(est).filter(c => c.dados && c.dados.length);
      document.getElementById('stats-content').innerHTML = categoriasComDados.length
        ? categoriasComDados.map(c => `
          <div class="card"><h3>${c.titulo}</h3>
            ${c.dados.map(p => `<div class="stat-row"><span>${p.jogador} <span style="color:var(--text-2)">· ${p.equipa}</span></span><span class="val">${p.valor}</span></div>`).join('')}
          </div>`).join('')
        : '<div class="empty-note">Estatísticas não disponíveis para esta liga.</div>';

    } catch (err) {
      document.getElementById('league-header').innerHTML = `<div class="empty-note">Não foi possível carregar: ${err.message}</div>`;
    }
  }

  carregar('all');
  document.querySelectorAll('#venue-filter .chip').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#venue-filter .chip').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('standings-table').innerHTML = '<div class="empty-note">A carregar...</div>';
      carregar(btn.dataset.venue);
    });
  });
</script>
  </div>
</div>


</body>
</html>
