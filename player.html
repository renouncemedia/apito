<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jogador · Apito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0C; --card:#1A1726; --card-2:#221E30;
    --line: rgba(255,255,255,0.08);
    --white:#FFFFFF; --text-0:#F2F2F3; --text-1: rgba(242,242,243,0.58); --text-2: rgba(242,242,243,0.34);
    --lime:#C6FF3D; --lime-dim: rgba(198,255,61,0.14); --purple:#7C5CFC; --purple-dim: rgba(124,92,252,0.16);
  }
  html[data-theme="light"]{
    --bg:#F4F4F6; --card:#FFFFFF; --card-2:#F0F0F3;
    --line: rgba(0,0,0,0.08);
    --white:#111114; --text-0:#111114; --text-1: rgba(17,17,20,0.62); --text-2: rgba(17,17,20,0.38);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background: var(--bg); color: var(--text-0); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; appearance:none; -webkit-appearance:none; }
  .shell{ max-width:860px; margin:0 auto; padding:24px; } @media (max-width:640px){ .shell{ padding:14px; } }
  .back{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color: var(--text-1); margin-bottom:16px; }

  .player-header{ display:flex; align-items:center; gap:16px; margin-bottom:20px; background: linear-gradient(120deg, #1E3A8A 0%, #172554 55%, #0D0B14 100%); border:1px solid var(--line-strong); border-radius:20px; padding:22px; color:#fff; }
  .player-header img, .player-header .fallback{ width:72px; height:72px; border-radius:50%; background: rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); object-fit:cover; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; flex-shrink:0; }
  .player-header .name{ font-size: clamp(19px,4vw,25px); font-weight:800; color:#fff; }
  .player-header .meta{ font-size:12px; color: rgba(255,255,255,0.65); margin-top:5px; }

  .info-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap:10px; margin-bottom:20px; }
  .info-box{ background: var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .info-box .val{ font-weight:700; font-size:14px; }
  .info-box .label{ font-size:10px; color: var(--text-2); text-transform:uppercase; letter-spacing:0.5px; margin-top:4px; }

  h2{ font-size:14.5px; font-weight:700; margin:18px 0 10px; }

  .card{ background: var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 14px; }

  .stat-row{ display:grid; grid-template-columns:1fr 40px 40px 40px 44px; gap:8px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .stat-row:last-child{ border-bottom:none; }
  .stat-row.head{ color: var(--text-2); font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }
  .stat-row .n{ text-align:center; }
  .stat-row .rating{ text-align:center; color: var(--lime); font-weight:700; }

  .transfer-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .transfer-row:last-child{ border-bottom:none; }
  .transfer-row .fee{ font-weight:700; color: var(--lime); }

  .empty-note{ font-size:13px; color: var(--text-2); padding:10px 0; }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--lime); outline-offset:2px; border-radius:6px; }
  .breadcrumb{ font-size:12px; color: var(--text-2); margin-bottom:12px; }
  .breadcrumb a{ color: var(--text-1); }
  .breadcrumb a:hover{ color: var(--text-0); text-decoration:underline; }

  /* ---------- Shell de navegação (partilhada com index.html) ---------- */
  :root{ --sidebar-w: 240px; --bottomnav-h: 64px; }
  .app-shell{ display:flex; min-height:100vh; }
  .sidebar{ width: var(--sidebar-w); flex-shrink:0; background: var(--bg-2); border-right:1px solid var(--line); padding:22px 16px; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; }
  .sidebar .brand{ display:flex; align-items:center; gap:10px; padding:0 8px; margin-bottom:28px; }
  .sidebar .brand .mark{ width:32px; height:32px; border-radius:9px; background: var(--lime); display:flex; align-items:center; justify-content:center; }
  .sidebar .brand .mark::before{ content:""; width:13px; height:13px; background:#0D0B14; clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%); }
  .sidebar .brand .name{ font-weight:800; font-size:18px; }
  .nav-item{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; font-size:13.5px; font-weight:600; color: var(--text-1); margin-bottom:3px; min-height:44px; }
  .nav-item svg{ width:18px; height:18px; opacity:0.8; flex-shrink:0; }
  .nav-item.active{ background: var(--lime-dim); color: var(--lime); }
  .nav-item:hover:not(.active){ background: var(--card-2); color: var(--text-0); }
  .sidebar-promo{ margin-top:auto; background: linear-gradient(150deg, var(--purple), #5B3FE0); border-radius:16px; padding:16px; }
  .sidebar-promo .title{ font-size:13px; font-weight:800; line-height:1.3; }
  .sidebar-promo .sub{ font-size:11px; opacity:0.8; margin-top:4px; }
  .sidebar-promo .cta{ display:inline-block; margin-top:12px; background:#fff; color:#161022; font-size:11.5px; font-weight:800; padding:8px 14px; border-radius:100px; }
  @media (max-width: 1023px){ .sidebar{ display:none; } }

  .main-area{ flex:1; min-width:0; padding-bottom: 24px; }
  

  .bottom-nav{ display:none; }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" aria-label="Navegação principal">
    <div class="brand"><div class="mark"></div><span class="name">Apito</span></div>
    <a href="index.html" class="nav-item " id="nav-inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Início</a>
    <a href="index.html?filtro=ao-vivo" class="nav-item " id="nav-ao-vivo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>Ao vivo</a>
    <a href="index.html?filtro=favoritos" class="nav-item " id="nav-favoritos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 17.3l-6.2 3.6 1.6-7-5.4-4.7 7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7z"/></svg>Favoritos</a>
    <button class="nav-item" id="nav-tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Tema</button>
    <div class="sidebar-promo">
      <div class="title">Apito PRO</div>
      <div class="sub">Estatísticas avançadas e sem limites de pedidos.</div>
      <div class="cta">Em breve</div>
    </div>
  </nav>

  <div class="main-area">
<div class="shell">
  <a class="back" href="index.html">← Voltar aos resultados</a>
  <div class="breadcrumb" id="breadcrumb"></div>

  <div class="player-header" id="player-header">
    <div class="fallback">—</div>
    <div><div class="name">A carregar...</div><div class="meta"></div></div>
  </div>

  <div class="info-grid" id="info-grid"></div>

  <h2>Estatísticas por competição</h2>
  <div class="card" id="stats-content"><div class="empty-note">A carregar...</div></div>

  <h2>Histórico de transferências</h2>
  <div class="card" id="transfers-content"><div class="empty-note">A carregar...</div></div>
</div>

<script>
  const root = document.documentElement;
  root.setAttribute('data-theme', localStorage.getItem('apito-theme') || 'dark');

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  async function carregar(){
    if (!id){
      document.getElementById('player-header').innerHTML = '<div class="empty-note">Nenhum jogador selecionado.</div>';
      return;
    }
    try {
      const resp = await fetch(`/api/player?id=${id}`);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      const j = data.jogador;
      document.getElementById('breadcrumb').innerHTML = j.equipaAtualId
        ? `<a href="index.html">Início</a> / <a href="team.html?id=${j.equipaAtualId}">${j.equipaAtual || 'Equipa'}</a> / ${j.nome || 'Jogador'}`
        : `<a href="index.html">Início</a> / ${j.nome || 'Jogador'}`;
      document.getElementById('player-header').innerHTML = `
        <img src="https://sports.bzzoiro.com/img/player/${j.id}/?bg=transparent" alt="${j.nome}" onerror="this.outerHTML='<div class=\\'fallback\\'>${(j.nome||'?').slice(0,2).toUpperCase()}</div>'">
        <div><div class="name">${j.nome || 'Jogador'}</div><div class="meta">${j.equipaAtual?j.equipaAtual:''}${j.posicao?' · '+j.posicao:''}</div></div>`;

      const infos = [
        ['Nacionalidade', j.nacionalidade], ['Posição', j.posicao],
        ['Nascimento', j.dataNascimento ? new Date(j.dataNascimento).toLocaleDateString('pt-PT') : null],
        ['Altura', j.altura ? `${j.altura} cm` : null], ['Pé preferido', j.pe], ['Número', j.numero]
      ].filter(([,v]) => v);
      document.getElementById('info-grid').innerHTML = infos.length
        ? infos.map(([label,val]) => `<div class="info-box"><div class="val">${val}</div><div class="label">${label}</div></div>`).join('') : '';

      const estatisticas = data.estatisticas || [];
      document.getElementById('stats-content').innerHTML = estatisticas.length
        ? `<div class="stat-row head"><span>Competição</span><span class="n">J</span><span class="n">G</span><span class="n">A</span><span class="n">Rating</span></div>
           ${estatisticas.map(s => `<div class="stat-row"><span>${s.competicao||'—'}</span><span class="n">${s.jogos??'-'}</span><span class="n">${s.golos??'-'}</span><span class="n">${s.assistencias??'-'}</span><span class="rating">${s.rating??'-'}</span></div>`).join('')}`
        : '<div class="empty-note">Estatísticas não disponíveis para este jogador.</div>';

      const transferencias = data.transferencias || [];
      document.getElementById('transfers-content').innerHTML = transferencias.length
        ? transferencias.map(t => `<div class="transfer-row"><span>${t.de||'?'} → ${t.para||'?'} <span style="color:var(--text-2)">· ${t.data?new Date(t.data).toLocaleDateString('pt-PT'):''}</span></span><span class="fee">${t.valor||''}</span></div>`).join('')
        : '<div class="empty-note">Sem histórico de transferências disponível.</div>';

    } catch (err) {
      document.getElementById('player-header').innerHTML = `<div class="empty-note">Não foi possível carregar: ${err.message}</div>`;
    }
  }

  carregar();
</script>
  </div>
</div>


</body>
</html>
