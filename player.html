<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jogador · Apito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Big+Shoulders+Display:wght@500;700;800;900&family=Big+Shoulders+Text:wght@500;600;700&display=swap" rel="stylesheet">
<!-- APITO V2 — canonical foundation tokens, shared by all five pages. See assets/foundation.css.
     This also fixes the V1 bug where player.html never defined --line-strong/--live/--blue/--red-stat,
     which left .player-header's border resolving against an undefined variable. -->
<link rel="stylesheet" href="assets/foundation.css">
<!-- APITO V2 — canonical shell/navigation (sidebar, topbar, bottom-nav). See assets/shell.css / assets/shell.js -->
<link rel="stylesheet" href="assets/shell.css">
<script src="assets/shell.js"></script>
<!-- APITO V2 — canonical shared components. See assets/components.css / assets/components.js -->
<link rel="stylesheet" href="assets/components.css">
<script src="assets/components.js"></script>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background: var(--bg); color: var(--text-0); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; appearance:none; -webkit-appearance:none; }
  .shell{ max-width:860px; margin:0 auto; padding:24px; } @media (max-width:640px){ .shell{ padding:14px; } }
  .back{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color: var(--text-1); margin-bottom:16px; }

  /* .player-header is now the canonical EntityHero component (Entity
     Gradient) shared in assets/components.css — see Pass 3B. */

  .info-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap:10px; margin-bottom:20px; }
  .info-box{ background: var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .info-box .val{ font-weight:700; font-size:14px; }
  .info-box .label{ font-size:10px; color: var(--text-2); text-transform:uppercase; letter-spacing:0.5px; margin-top:4px; }

  h2{ font-size:14.5px; font-weight:700; margin:18px 0 10px; }

  .card{ background: var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 14px; }

  .stat-row{ display:grid; grid-template-columns:1fr 40px 40px 40px 44px; gap:8px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .stat-row:last-child{ border-bottom:none; }
  .stat-row.head{ color: var(--text-2); font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }
  .stat-row .n{ text-align:center; font-family: var(--font-numeral); font-variant-numeric: tabular-nums; }
  .stat-row .rating{ text-align:center; color: var(--lime); font-weight:700; font-family: var(--font-numeral); font-variant-numeric: tabular-nums; }

  .transfer-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .transfer-row:last-child{ border-bottom:none; }
  .transfer-row .fee{ font-weight:700; color: var(--lime); }

  /* .empty-note is now canonical in assets/components.css */
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--lime); outline-offset:2px; border-radius:6px; }
  .breadcrumb{ font-size:12px; color: var(--text-2); margin-bottom:12px; }
  .breadcrumb a{ color: var(--text-1); }
  .breadcrumb a:hover{ color: var(--text-0); text-decoration:underline; }

  /* Shell/navigation (sidebar, topbar chrome, bottom-nav) now lives in
     assets/shell.css, shared by all five pages — see Pass 2. */
</style>
</head>
<body>
<div class="app-shell">
  <!-- Sidebar (desktop) — canonical markup rendered by assets/shell.js, shared by all five pages -->
  <script>ApitoShell.renderSidebar();</script>

  <!-- Bottom navigation (mobile, persistent) — canonical markup rendered by assets/shell.js -->
  <script>ApitoShell.renderBottomNav();</script>

  <div class="main-area">
<div class="shell">
  <!-- Topbar — canonical markup rendered by assets/shell.js -->
  <script>ApitoShell.renderTopbar();</script>

  <a class="back" href="index.html">← Voltar aos resultados</a>
  <div class="breadcrumb" id="breadcrumb"></div>

  <div class="player-header" id="player-header">
    <div class="fallback">—</div>
    <div><div class="name">A carregar...</div><div class="meta"></div></div>
  </div>

  <div class="info-grid" id="info-grid"></div>

  <h2>Estatísticas por competição</h2>
  <div class="card" id="stats-content"><div class="empty-note">A carregar...</div></div>

  <h2>Histórico de transferências</h2>
  <div class="card" id="transfers-content"><div class="empty-note">A carregar...</div></div>
</div>

<script>
  // Theme state is applied by assets/shell.js before this script runs —
  // no per-page initialization needed here (see Pass 2).

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  async function carregar(){
    if (!id){
      document.getElementById('player-header').innerHTML = '<div class="empty-note">Nenhum jogador selecionado.</div>';
      return;
    }
    try {
      const resp = await fetch(`/api/player?id=${id}`);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      const j = data.jogador;
      document.getElementById('breadcrumb').innerHTML = j.equipaAtualId
        ? `<a href="index.html">Início</a> / <a href="team.html?id=${j.equipaAtualId}">${j.equipaAtual || 'Equipa'}</a> / ${j.nome || 'Jogador'}`
        : `<a href="index.html">Início</a> / ${j.nome || 'Jogador'}`;

      const estatisticas = data.estatisticas || [];
      // Headline stat: main competition (most matches played) golos, shown
      // as a pull-out number in the header — brings Player to visual parity
      // with Team/League headers, per the design system's Player screen.
      const principal = estatisticas.slice().sort((a,b) => (b.jogos||0) - (a.jogos||0))[0];
      const headline = principal && principal.golos != null
        ? `<div class="eh-stat"><div class="value">${principal.golos}</div><div class="label">Golos</div></div>` : '';

      document.getElementById('player-header').innerHTML = `
        <img src="https://sports.bzzoiro.com/img/player/${j.id}/?bg=transparent" alt="${j.nome}" onerror="this.outerHTML='<div class=\\'fallback\\'>${(j.nome||'?').slice(0,2).toUpperCase()}</div>'">
        <div><div class="name">${j.nome || 'Jogador'}</div><div class="meta">${j.equipaAtual?j.equipaAtual:''}${j.posicao?' · '+j.posicao:''}</div></div>
        ${headline}`;

      const infos = [
        ['Nacionalidade', j.nacionalidade], ['Posição', j.posicao],
        ['Nascimento', j.dataNascimento ? new Date(j.dataNascimento).toLocaleDateString('pt-PT') : null],
        ['Altura', j.altura ? `${j.altura} cm` : null], ['Pé preferido', j.pe], ['Número', j.numero]
      ].filter(([,v]) => v);
      document.getElementById('info-grid').innerHTML = infos.length
        ? infos.map(([label,val]) => `<div class="info-box"><div class="val">${val}</div><div class="label">${label}</div></div>`).join('') : '';

      document.getElementById('stats-content').innerHTML = estatisticas.length
        ? `<div class="stat-row head"><span>Competição</span><span class="n">J</span><span class="n">G</span><span class="n">A</span><span class="n">Rating</span></div>
           ${estatisticas.map(s => `<div class="stat-row"><span>${s.competicao||'—'}</span><span class="n">${s.jogos??'-'}</span><span class="n">${s.golos??'-'}</span><span class="n">${s.assistencias??'-'}</span><span class="rating">${s.rating??'-'}</span></div>`).join('')}`
        : '<div class="empty-note">Estatísticas não disponíveis para este jogador.</div>';

      const transferencias = data.transferencias || [];
      document.getElementById('transfers-content').innerHTML = transferencias.length
        ? transferencias.map(t => `<div class="transfer-row"><span>${t.de||'?'} → ${t.para||'?'} <span style="color:var(--text-2)">· ${t.data?new Date(t.data).toLocaleDateString('pt-PT'):''}</span></span><span class="fee">${t.valor||''}</span></div>`).join('')
        : '<div class="empty-note">Sem histórico de transferências disponível.</div>';

    } catch (err) {
      document.getElementById('player-header').innerHTML = `<div class="empty-note">Não foi possível carregar: ${err.message}</div>`;
    }
  }

  carregar();
</script>
  </div>
</div>


</body>
</html>
