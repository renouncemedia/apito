<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogador · Apito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0C; --panel:#161618; --panel-2:#1E1E20;
    --lime:#D6FF3F; --lime-dim: rgba(214,255,63,0.14);
    --orange:#FF5A36;
    --line: rgba(255,255,255,0.08);
    --text-0:#F5F5F0; --text-1: rgba(245,245,240,0.58); --text-2: rgba(245,245,240,0.34);
  }
  html[data-theme="light"]{
    --ink:#F7F7F2; --panel:#FFFFFF; --panel-2:#F0F0EC;
    --lime:#7EA300; --lime-dim: rgba(126,163,0,0.12);
    --orange:#E14A26;
    --line: rgba(0,0,0,0.08);
    --text-0:#141412; --text-1: rgba(20,20,18,0.62); --text-2: rgba(20,20,18,0.38);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background: var(--ink); color: var(--text-0); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing: antialiased; }
  a{ color:inherit; text-decoration:none; }
  .shell{ max-width: 720px; margin: 0 auto; padding: 20px; }
  .back{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color: var(--text-1); margin-bottom:16px; }

  .player-header{ display:flex; align-items:center; gap:16px; margin-bottom:20px; }
  .player-header img, .player-header .fallback{ width:72px; height:72px; border-radius:50%; background: var(--panel); border:1px solid var(--line); object-fit:cover; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; flex-shrink:0; }
  .player-header .name{ font-family:'Archivo Black', sans-serif; font-size: clamp(18px,4vw,24px); }
  .player-header .meta{ font-size:12px; color: var(--text-2); margin-top:4px; }

  .info-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr)); gap:10px; margin-bottom:20px; }
  .info-box{ background: var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .info-box .val{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:14px; }
  .info-box .label{ font-size:10px; color: var(--text-2); text-transform:uppercase; letter-spacing:0.5px; margin-top:3px; }

  h2{ font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:700; margin: 20px 0 10px; }

  .stat-row{ display:grid; grid-template-columns: 1fr 40px 40px 40px 44px; gap:8px; align-items:center; padding:9px 4px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .stat-row.head{ color: var(--text-2); font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; font-weight:700; }
  .stat-row .n{ text-align:center; }
  .stat-row .rating{ text-align:center; color: var(--lime); font-weight:700; }

  .transfer-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 4px; border-bottom:1px solid var(--line); font-size:12.5px; }
  .transfer-row:last-child{ border-bottom:none; }
  .transfer-row .fee{ font-family:'Space Grotesk', sans-serif; font-weight:700; color: var(--lime); }

  .empty-note{ font-size:13px; color:var(--text-2); }
</style>
</head>
<body>
<div class="shell">
  <a class="back" href="index.html">← Voltar aos resultados</a>

  <div class="player-header" id="player-header">
    <div class="fallback">—</div>
    <div>
      <div class="name">A carregar...</div>
      <div class="meta"></div>
    </div>
  </div>

  <div class="info-grid" id="info-grid"></div>

  <h2>Estatísticas por competição</h2>
  <div id="stats-content"><div class="empty-note">A carregar...</div></div>

  <h2>Histórico de transferências</h2>
  <div id="transfers-content"><div class="empty-note">A carregar...</div></div>
</div>

<script>
  const root = document.documentElement;
  root.setAttribute('data-theme', localStorage.getItem('apito-theme') || 'dark');

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  async function carregar(){
    if (!id){
      document.getElementById('player-header').innerHTML = '<div class="empty-note">Nenhum jogador selecionado.</div>';
      return;
    }
    try {
      const resp = await fetch(`/api/player?id=${id}`);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      const j = data.jogador;
      document.getElementById('player-header').innerHTML = `
        <img src="https://sports.bzzoiro.com/img/player/${j.id}/?bg=transparent" alt="${j.nome}" onerror="this.outerHTML='<div class=\\'fallback\\'>${(j.nome||'?').slice(0,2).toUpperCase()}</div>'">
        <div>
          <div class="name">${j.nome || 'Jogador'}</div>
          <div class="meta">${j.equipaAtual ? j.equipaAtual : ''}${j.posicao ? ' · ' + j.posicao : ''}</div>
        </div>`;

      const infos = [
        ['Nacionalidade', j.nacionalidade],
        ['Posição', j.posicao],
        ['Nascimento', j.dataNascimento ? new Date(j.dataNascimento).toLocaleDateString('pt-PT') : null],
        ['Altura', j.altura ? `${j.altura} cm` : null],
        ['Pé preferido', j.pe],
        ['Número', j.numero]
      ].filter(([, v]) => v);
      document.getElementById('info-grid').innerHTML = infos.length
        ? infos.map(([label, val]) => `<div class="info-box"><div class="val">${val}</div><div class="label">${label}</div></div>`).join('')
        : '';

      const estatisticas = data.estatisticas || [];
      document.getElementById('stats-content').innerHTML = estatisticas.length
        ? `<div class="stat-row head"><span>Competição</span><span class="n">J</span><span class="n">G</span><span class="n">A</span><span class="n">Rating</span></div>
           ${estatisticas.map(s => `
            <div class="stat-row">
              <span>${s.competicao || '—'}</span>
              <span class="n">${s.jogos ?? '-'}</span>
              <span class="n">${s.golos ?? '-'}</span>
              <span class="n">${s.assistencias ?? '-'}</span>
              <span class="rating">${s.rating ?? '-'}</span>
            </div>`).join('')}`
        : '<div class="empty-note">Estatísticas não disponíveis para este jogador.</div>';

      const transferencias = data.transferencias || [];
      document.getElementById('transfers-content').innerHTML = transferencias.length
        ? transferencias.map(t => `
          <div class="transfer-row">
            <span>${t.de || '?'} → ${t.para || '?'} <span style="color:var(--text-2)">· ${t.data ? new Date(t.data).toLocaleDateString('pt-PT') : ''}</span></span>
            <span class="fee">${t.valor || ''}</span>
          </div>`).join('')
        : '<div class="empty-note">Sem histórico de transferências disponível.</div>';

    } catch (err) {
      document.getElementById('player-header').innerHTML = `<div class="empty-note">Não foi possível carregar: ${err.message}</div>`;
    }
  }

  carregar();
</script>
</body>
</html>
