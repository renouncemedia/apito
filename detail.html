<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhe do jogo · Apito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0C; --panel:#161618; --panel-2:#1E1E20;
    --lime:#D6FF3F; --lime-dim: rgba(214,255,63,0.14);
    --orange:#FF5A36; --orange-dim: rgba(255,90,54,0.16);
    --line: rgba(255,255,255,0.08); --line-strong: rgba(255,255,255,0.16);
    --text-0:#F5F5F0; --text-1: rgba(245,245,240,0.58); --text-2: rgba(245,245,240,0.34);
  }
  html[data-theme="light"]{
    --ink:#F7F7F2; --panel:#FFFFFF; --panel-2:#F0F0EC;
    --lime:#7EA300; --lime-dim: rgba(126,163,0,0.12);
    --orange:#E14A26; --orange-dim: rgba(225,74,38,0.10);
    --line: rgba(0,0,0,0.08); --line-strong: rgba(0,0,0,0.16);
    --text-0:#141412; --text-1: rgba(20,20,18,0.62); --text-2: rgba(20,20,18,0.38);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background: var(--ink); color: var(--text-0); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing: antialiased; }
  a{ color:inherit; text-decoration:none; }
  .shell{ max-width: 780px; margin: 0 auto; padding: 24px; }

  .back{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color: var(--text-1); margin-bottom:20px; }

  .score-block{
    background: linear-gradient(120deg, var(--orange), #FF7A4D);
    border-radius: 20px; padding: 26px 22px; color:#17110B;
    display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
    margin-bottom: 24px;
  }
  .score-block .liga{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; opacity:0.7; }
  .score-block .teams{ font-family:'Archivo Black', sans-serif; font-size: clamp(18px,4vw,26px); }
  .score-block .teams a{ text-decoration: underline; text-underline-offset: 3px; }
  .score-block .score{ font-family:'Archivo Black', sans-serif; font-size: clamp(38px,8vw,56px); }
  .score-block .estado{ font-size:12px; font-weight:700; }

  h2{ font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:700; margin: 26px 0 12px; }

  .event-row{ display:flex; align-items:center; gap:12px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:13px; }
  .event-row:last-child{ border-bottom:none; }
  .event-min{ font-family:'Space Grotesk', sans-serif; font-weight:700; color: var(--lime); min-width:34px; }
  .event-desc{ color: var(--text-1); }
  .event-desc b{ color: var(--text-0); }
  .event-tag{ font-size:10px; padding:2px 7px; border-radius:5px; background: var(--panel-2); color: var(--text-2); margin-left:6px; }
  .event-tag.golo{ background: var(--lime-dim); color: var(--lime); }
  .event-tag.amarelo{ background: rgba(240,200,60,0.15); color: #F0C83C; }
  .event-tag.vermelho{ background: rgba(255,90,54,0.15); color: var(--orange); }

  .lineups{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 560px){ .lineups{ grid-template-columns: 1fr; } }
  .lineup-card{ background: var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .lineup-card h3{ font-family:'Space Grotesk', sans-serif; font-size:14px; margin-bottom:4px; }
  .lineup-card .formacao{ font-size:11px; color:var(--text-2); margin-bottom:10px; }
  .player-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 0; color:var(--text-1); }
  .player-row .num{ width:20px; height:20px; border-radius:6px; background:var(--lime-dim); color:var(--lime); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; flex-shrink:0; }
  .player-row .cap{ font-size:10px; color: var(--orange); font-weight:700; margin-left:2px; }

  .injury-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:6px 0; color: var(--text-1); border-bottom:1px solid var(--line); }
  .injury-row:last-child{ border-bottom:none; }
  .injury-row .motivo{ color: var(--text-2); font-size:11px; }

  .stat-row{ display:grid; grid-template-columns: 42px 1fr 42px; align-items:center; gap:10px; padding:9px 2px; font-size:13px; }
  .stat-row .val{ font-family:'Space Grotesk', sans-serif; font-weight:700; text-align:center; }
  .stat-row .label{ text-align:center; color: var(--text-2); font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px; }
  .stat-bar{ height:4px; border-radius:2px; background: var(--line); position:relative; overflow:hidden; margin-top:4px; grid-column: 1 / -1; }
  .stat-bar .fill{ position:absolute; left:0; top:0; bottom:0; background: var(--lime); }

  .momentum-chart{ display:flex; align-items:center; height:70px; gap:1px; background: var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; }
  .momentum-bar{ flex:1; min-width:2px; background: var(--lime); align-self:flex-end; border-radius:1px 1px 0 0; }
  .momentum-bar.negativo{ background: var(--orange); align-self:flex-start; }
  .momentum-mid{ position:relative; }

  .pitch{ position:relative; width:100%; aspect-ratio: 3/2; background: linear-gradient(180deg, #123a1e, #0d2c17); border-radius:12px; border:1px solid var(--line); overflow:hidden; }
  .pitch::before{ content:""; position:absolute; inset:8%; border:1px solid rgba(255,255,255,0.15); }
  .pitch::after{ content:""; position:absolute; left:50%; top:8%; bottom:8%; width:1px; background: rgba(255,255,255,0.15); }
  .pitch-player{ position:absolute; width:26px; height:26px; border-radius:50%; background: var(--lime); color:var(--ink); font-size:9px; font-weight:800; display:flex; align-items:center; justify-content:center; transform:translate(-50%,-50%); }
  .pitch-player.away{ background: var(--orange); }
  .pitch-legend{ display:flex; gap:14px; margin-top:8px; font-size:11px; color:var(--text-2); }
  .pitch-legend span{ display:inline-flex; align-items:center; gap:5px; }
  .pitch-legend .dot{ width:9px; height:9px; border-radius:50%; }

  .empty-note{ font-size:13px; color:var(--text-2); }
</style>
</head>
<body>
<div class="shell">
  <a class="back" href="index.html">← Voltar aos resultados</a>

  <div class="score-block" id="score-block">
    <div class="liga">A carregar...</div>
    <div class="teams">—</div>
    <div class="score">– : –</div>
    <div class="estado"></div>
  </div>

  <h2>Confronto direto</h2>
  <div id="h2h"><div class="empty-note">A carregar...</div></div>

  <h2>Jogadores em falta</h2>
  <div id="em-falta"><div class="empty-note">A carregar...</div></div>

  <h2>Estatísticas</h2>
  <div id="stats"><div class="empty-note">A carregar...</div></div>

  <h2>Intensidade do jogo</h2>
  <div id="momentum"><div class="empty-note">A carregar...</div></div>

  <h2>Eventos</h2>
  <div id="events"><div class="empty-note">A carregar eventos...</div></div>

  <h2>Escalações</h2>
  <div class="lineups" id="lineups"><div class="empty-note">A carregar escalações...</div></div>

  <h2>Posições médias</h2>
  <div id="pitch"><div class="empty-note">A carregar...</div></div>
</div>

<script>
  const root = document.documentElement;
  root.setAttribute('data-theme', localStorage.getItem('apito-theme') || 'dark');

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  const classeTag = { 'Golo': 'golo', 'Cartão amarelo': 'amarelo', 'Cartão vermelho': 'vermelho' };

  async function carregar(){
    if (!id){
      ['score-block','h2h','em-falta','events','lineups'].forEach(sid => document.getElementById(sid).innerHTML = '');
      document.getElementById('score-block').innerHTML = '<div class="liga">Nenhum jogo selecionado</div>';
      return;
    }
    try{
      const resp = await fetch(`/api/fixture?id=${id}`);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      // ---- Placar ----
      const j = data.jogo;
      if (j){
        document.getElementById('score-block').innerHTML = `
          <div class="liga">${j.liga}</div>
          <div class="teams"><a href="team.html?id=${j.casa.id}">${j.casa.nome}</a> vs <a href="team.html?id=${j.fora.id}">${j.fora.nome}</a></div>
          <div class="score">${j.casa.golos ?? '–'} : ${j.fora.golos ?? '–'}</div>
          <div class="estado">${j.estado === 'FT' ? 'Terminado' : j.estado === 'NS' ? 'Ainda não começou' : 'Em direto'}${j.minuto ? ' · ' + j.minuto + "'" : ''}</div>`;
      }

      // ---- Confronto direto ----
      const h2h = data.h2h;
      if (h2h && h2h.totalJogos){
        document.getElementById('h2h').innerHTML = `
          <div class="event-row"><span class="event-desc">Últimos ${h2h.totalJogos} confrontos: <b>${h2h.vitoriasCasa}</b> vitórias casa · <b>${h2h.empates}</b> empates · <b>${h2h.vitoriasFora}</b> vitórias fora</span></div>
          ${(h2h.recentes || []).map(m => `<div class="event-row"><span class="event-desc">${m.casa} ${m.resultado} ${m.fora} <span style="opacity:0.5">· ${new Date(m.data).toLocaleDateString('pt-PT')}</span></span></div>`).join('')}`;
      } else {
        document.getElementById('h2h').innerHTML = '<div class="empty-note">Sem histórico de confrontos disponível.</div>';
      }

      // ---- Jogadores em falta ----
      const emFalta = data.emFalta;
      const totalFalta = (emFalta?.casa?.length || 0) + (emFalta?.fora?.length || 0);
      if (emFalta && totalFalta > 0){
        const linhas = [
          ...(emFalta.casa || []).map(p => `<div class="injury-row"><span>${p.nome} <span class="motivo">(${j?.casa?.nome || 'casa'})</span></span><span class="motivo">${p.motivo || ''}</span></div>`),
          ...(emFalta.fora || []).map(p => `<div class="injury-row"><span>${p.nome} <span class="motivo">(${j?.fora?.nome || 'fora'})</span></span><span class="motivo">${p.motivo || ''}</span></div>`)
        ];
        document.getElementById('em-falta').innerHTML = linhas.join('');
      } else {
        document.getElementById('em-falta').innerHTML = '<div class="empty-note">Sem informação de lesões/suspensões para este jogo.</div>';
      }

      // ---- Estatísticas ----
      const estatisticas = data.estatisticas || [];
      document.getElementById('stats').innerHTML = estatisticas.length
        ? estatisticas.map(s => {
            const casaNum = parseFloat(s.casa) || 0, foraNum = parseFloat(s.fora) || 0;
            const total = casaNum + foraNum || 1;
            const pctCasa = Math.round((casaNum / total) * 100);
            return `
              <div class="stat-row">
                <span class="val">${s.casa}${s.sufixo}</span>
                <span class="label">${s.label}</span>
                <span class="val">${s.fora}${s.sufixo}</span>
                <div class="stat-bar"><div class="fill" style="width:${pctCasa}%"></div></div>
              </div>`;
          }).join('')
        : '<div class="empty-note">Estatísticas não disponíveis para este jogo.</div>';

      // ---- Momentum ----
      const momentum = data.momentum || [];
      if (momentum.length){
        const maxAbs = Math.max(...momentum.map(m => Math.abs(m.valor))) || 1;
        document.getElementById('momentum').innerHTML = `
          <div class="momentum-chart">
            ${momentum.map(m => {
              const altura = Math.max(4, Math.round((Math.abs(m.valor) / maxAbs) * 55));
              return `<div class="momentum-bar ${m.valor < 0 ? 'negativo' : ''}" style="height:${altura}px" title="Minuto ${m.minuto}"></div>`;
            }).join('')}
          </div>
          <p class="empty-note" style="margin-top:6px;">Lima = pressão da equipa da casa · Laranja = pressão da equipa visitante</p>`;
      } else {
        document.getElementById('momentum').innerHTML = '<div class="empty-note">Sem dados de intensidade para este jogo.</div>';
      }

      // ---- Eventos ----
      const eventos = (data.eventos || []).filter(e => e && e.jogador && e.tipo);
      document.getElementById('events').innerHTML = eventos.length
        ? eventos.map(e => `
          <div class="event-row">
            <span class="event-min">${e.minuto ?? ''}'</span>
            <span class="event-desc"><b>${e.jogador}</b>${e.equipa ? ' · ' + e.equipa : ''}${e.extra ? ' · ' + e.extra : ''}</span>
            <span class="event-tag ${classeTag[e.tipo] || ''}">${e.tipo}</span>
          </div>`).join('')
        : '<div class="empty-note">Sem eventos registados ainda.</div>';

      // ---- Escalações ----
      const escalacoes = data.escalacoes || [];
      if (escalacoes.length && escalacoes.some(eq => eq.titulares && eq.titulares.length)){
        document.getElementById('lineups').innerHTML = escalacoes.map(eq => `
          <div class="lineup-card">
            <h3>${eq.equipa}</h3>
            <div class="formacao">Formação: ${eq.formacao || '—'}</div>
            ${eq.titulares.map(p => `<div class="player-row" style="cursor:pointer" onclick="window.location.href='player.html?id=${p.id}'"><span class="num">${p.numero ?? '-'}</span>${p.nome}${p.capitao ? '<span class="cap">C</span>' : ''}</div>`).join('')}
          </div>`).join('');
      } else {
        const motivo = data.lineupsStatus === 'predicted' ? 'ainda não há escalação oficial (previsão indisponível)'
          : data.lineupsStatus === 'unavailable' ? 'sem dados de escalação para este jogo'
          : 'ainda não disponíveis';
        document.getElementById('lineups').innerHTML = `<div class="empty-note">Escalações ${motivo}.</div>`;
      }

      // ---- Posições médias (campo tático) ----
      const posicoes = data.posicoesMedias;
      const temPosicoes = posicoes && ((posicoes.casa?.length || 0) + (posicoes.fora?.length || 0)) > 0;
      if (temPosicoes){
        const marcadores = [
          ...(posicoes.casa || []).map(p => `<div class="pitch-player" style="left:${p.x}%; top:${100 - p.y}%;" title="${p.nome}">${p.numero ?? ''}</div>`),
          ...(posicoes.fora || []).map(p => `<div class="pitch-player away" style="left:${100 - p.x}%; top:${p.y}%;" title="${p.nome}">${p.numero ?? ''}</div>`)
        ];
        document.getElementById('pitch').innerHTML = `
          <div class="pitch">${marcadores.join('')}</div>
          <div class="pitch-legend">
            <span><span class="dot" style="background:var(--lime)"></span>${j?.casa?.nome || 'Casa'}</span>
            <span><span class="dot" style="background:var(--orange)"></span>${j?.fora?.nome || 'Fora'}</span>
          </div>`;
      } else {
        document.getElementById('pitch').innerHTML = '<div class="empty-note">Posições médias ainda não disponíveis (normal em jogos ao vivo ou em ligas menores).</div>';
      }

    } catch(err){
      document.getElementById('score-block').innerHTML = `<div class="liga">Não foi possível carregar: ${err.message}</div>`;
      document.getElementById('h2h').innerHTML = '';
      document.getElementById('em-falta').innerHTML = '';
      document.getElementById('events').innerHTML = '';
      document.getElementById('lineups').innerHTML = '';
      document.getElementById('momentum').innerHTML = '';
      document.getElementById('pitch').innerHTML = '';
      document.getElementById('stats').innerHTML = '';
    }
  }

  carregar();
</script>
</body>
</html>
