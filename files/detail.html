<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhe do jogo · Apito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B0C; --panel:#161618; --panel-2:#1E1E20;
    --lime:#D6FF3F; --lime-dim: rgba(214,255,63,0.14);
    --orange:#FF5A36; --orange-dim: rgba(255,90,54,0.16);
    --line: rgba(255,255,255,0.08); --line-strong: rgba(255,255,255,0.16);
    --text-0:#F5F5F0; --text-1: rgba(245,245,240,0.58); --text-2: rgba(245,245,240,0.34);
  }
  html[data-theme="light"]{
    --ink:#F7F7F2; --panel:#FFFFFF; --panel-2:#F0F0EC;
    --lime:#7EA300; --lime-dim: rgba(126,163,0,0.12);
    --orange:#E14A26; --orange-dim: rgba(225,74,38,0.10);
    --line: rgba(0,0,0,0.08); --line-strong: rgba(0,0,0,0.16);
    --text-0:#141412; --text-1: rgba(20,20,18,0.62); --text-2: rgba(20,20,18,0.38);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background: var(--ink); color: var(--text-0); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing: antialiased; }
  a{ color:inherit; text-decoration:none; }
  .shell{ max-width: 780px; margin: 0 auto; padding: 24px; }

  .back{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color: var(--text-1); margin-bottom:20px; }

  .score-block{
    background: linear-gradient(120deg, var(--orange), #FF7A4D);
    border-radius: 20px; padding: 26px 22px; color:#17110B;
    display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center;
    margin-bottom: 24px;
  }
  .score-block .liga{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; opacity:0.7; }
  .score-block .teams{ font-family:'Archivo Black', sans-serif; font-size: clamp(18px,4vw,26px); }
  .score-block .score{ font-family:'Archivo Black', sans-serif; font-size: clamp(38px,8vw,56px); }
  .score-block .estado{ font-size:12px; font-weight:700; }

  h2{ font-family:'Space Grotesk', sans-serif; font-size:16px; font-weight:700; margin: 26px 0 12px; }

  .event-row{ display:flex; align-items:center; gap:12px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:13px; }
  .event-row:last-child{ border-bottom:none; }
  .event-min{ font-family:'Space Grotesk', sans-serif; font-weight:700; color: var(--lime); min-width:34px; }
  .event-desc{ color: var(--text-1); }
  .event-desc b{ color: var(--text-0); }

  .lineups{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 560px){ .lineups{ grid-template-columns: 1fr; } }
  .lineup-card{ background: var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .lineup-card h3{ font-family:'Space Grotesk', sans-serif; font-size:14px; margin-bottom:4px; }
  .lineup-card .formacao{ font-size:11px; color:var(--text-2); margin-bottom:10px; }
  .player-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; padding:5px 0; color:var(--text-1); }
  .player-row .num{ width:20px; height:20px; border-radius:6px; background:var(--lime-dim); color:var(--lime); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:800; flex-shrink:0; }

  .empty-note{ font-size:13px; color:var(--text-2); }
</style>
</head>
<body>
<div class="shell">
  <a class="back" href="index.html">← Voltar aos resultados</a>

  <div class="score-block" id="score-block">
    <div class="liga">A carregar...</div>
    <div class="teams">—</div>
    <div class="score">– : –</div>
    <div class="estado"></div>
  </div>

  <h2>Eventos</h2>
  <div id="events">
    <div class="empty-note">A carregar eventos...</div>
  </div>

  <h2>Escalações</h2>
  <div class="lineups" id="lineups">
    <div class="empty-note">A carregar escalações...</div>
  </div>
</div>

<script>
  const root = document.documentElement;
  root.setAttribute('data-theme', localStorage.getItem('apito-theme') || 'dark');

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  const nomeEvento = {
    'Goal': 'Golo', 'Card': 'Cartão', 'subst': 'Substituição', 'Var': 'VAR'
  };

  async function carregar(){
    if (!id){
      document.getElementById('score-block').innerHTML = '<div class="liga">Nenhum jogo selecionado</div>';
      return;
    }
    try{
      const resp = await fetch(`/api/fixture?id=${id}`);
      const data = await resp.json();
      if (data.error) throw new Error(data.error);

      const j = data.jogo;
      if (j){
        document.getElementById('score-block').innerHTML = `
          <div class="liga">${j.liga}</div>
          <div class="teams">${j.casa.nome} vs ${j.fora.nome}</div>
          <div class="score">${j.casa.golos ?? '–'} : ${j.fora.golos ?? '–'}</div>
          <div class="estado">${j.estado}${j.minuto ? ' · ' + j.minuto + "'" : ''}</div>`;
      }

      const eventos = data.eventos || [];
      document.getElementById('events').innerHTML = eventos.length
        ? eventos.map(e => `
          <div class="event-row">
            <span class="event-min">${e.minuto}'</span>
            <span class="event-desc"><b>${e.jogador}</b> · ${nomeEvento[e.tipo] || e.tipo} (${e.equipa})${e.assistencia ? ' · assist: ' + e.assistencia : ''}</span>
          </div>`).join('')
        : '<div class="empty-note">Sem eventos registados ainda.</div>';

      const escalacoes = data.escalacoes || [];
      document.getElementById('lineups').innerHTML = escalacoes.length
        ? escalacoes.map(eq => `
          <div class="lineup-card">
            <h3>${eq.equipa}</h3>
            <div class="formacao">Formação: ${eq.formacao || '—'}</div>
            ${eq.titulares.map(p => `<div class="player-row"><span class="num">${p.numero ?? '-'}</span>${p.nome}</div>`).join('')}
          </div>`).join('')
        : '<div class="empty-note">Escalações ainda não disponíveis.</div>';

    } catch(err){
      document.getElementById('score-block').innerHTML = `<div class="liga">Não foi possível carregar: ${err.message}</div>`;
      document.getElementById('events').innerHTML = '';
      document.getElementById('lineups').innerHTML = '';
    }
  }

  carregar();
</script>
</body>
</html>
