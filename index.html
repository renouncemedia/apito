<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Apito · Resultados de Futebol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Big+Shoulders+Display:wght@500;700;800;900&family=Big+Shoulders+Text:wght@500;600;700&display=swap" rel="stylesheet">
<!-- APITO V2 — canonical foundation tokens, shared by all five pages. See assets/foundation.css -->
<link rel="stylesheet" href="assets/foundation.css">
<!-- APITO V2 — canonical shell/navigation (sidebar, topbar, bottom-nav). See assets/shell.css / assets/shell.js -->
<link rel="stylesheet" href="assets/shell.css">
<script src="assets/shell.js"></script>
<!-- APITO V2 — canonical shared components (Pass 3A: MatchRow). See assets/components.css / assets/components.js -->
<link rel="stylesheet" href="assets/components.css">
<script src="assets/components.js"></script>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background: var(--bg); color: var(--text-0); font-family:'Inter', sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; appearance:none; -webkit-appearance:none; }
  ::selection{ background: var(--lime); color:#0D0B14; }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible, input:focus-visible{ outline:2px solid var(--lime); outline-offset:2px; border-radius:6px; }

  /* Shell/navigation (sidebar, topbar chrome, bottom-nav) now lives in
     assets/shell.css, shared by all five pages — see Pass 2. Only this
     page's own container width and search-box (Home-specific
     functionality) remain here. */
  .shell{ max-width: 1180px; margin:0 auto; padding: 0 20px; }
  @media (max-width:640px){ .shell{ padding: 0 12px; } }

  .search-box{ flex:1; display:flex; align-items:center; gap:8px; background: var(--card); border:1px solid var(--line); border-radius:100px; padding:0 16px; height:40px; min-width:0; }
  .search-box svg{ width:14px; height:14px; opacity:0.45; flex-shrink:0; }
  .search-box input{ background:none; border:none; outline:none; color: var(--text-0); font-size:16px; width:100%; }
  .search-box input::placeholder{ color: var(--text-2); }

  /* Live carousel — hosts the editorial FeaturedMatch context (gradient
     wrapper) from assets/components.css, each containing one canonical,
     ungradiented Expanded MatchRow. The old .hero-card family
     (hero-card/hero-teams-row/hero-crest/hero-sub2/hero-live-tag) is
     retired — see Pass 3A migration report / correction 2. */
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* Day strip — chips circulares tipo calendário */
  /* Home intro — editorial opening, typography + whitespace only (no
     card, no gradient). Establishes identity → date context → today
     snapshot before the utility filters/feed begin. */
  .home-intro{ padding: var(--space-7) 0 var(--space-2); }
  @media (max-width:640px){ .home-intro{ padding: var(--space-6) 0 var(--space-2); } }
  .home-title{
    font-family: var(--type-entity-title-family);
    font-size: clamp(23px, 3.4vw, 29px);
    font-weight:800;
    letter-spacing:-0.01em;
    color: var(--text-0);
  }
  .home-context{
    display:flex; flex-wrap:wrap; align-items:baseline; gap:8px;
    margin-top:9px;
    font-size:13px;
    color: var(--text-1);
  }
  .home-context .sep{ color: var(--text-2); }
  .home-date{ font-weight:700; color: var(--text-0); }
  .home-date::first-letter{ text-transform:uppercase; }
  .home-snapshot-num{ font-family: var(--font-numeral); font-variant-numeric: tabular-nums; font-weight:700; color: var(--text-0); }
  .home-snapshot-num.is-live{ color: var(--live); }

  .toolbar{ display:flex; align-items:center; gap:10px; padding: 6px 0 14px; }

  .date-pill{ flex-shrink:0; display:flex; align-items:center; gap:8px; background: var(--card); border:1px solid var(--line); border-radius:100px; padding: 9px 15px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .date-pill.date-pill-main{ padding: 11px 18px; font-size:13.5px; font-weight:700; border-color: var(--line-strong); transition: border-color .15s, transform .15s; }
  .date-pill.date-pill-main:hover{ border-color: var(--lime); transform: translateY(-1px); }
  .date-pill .dot{ width:6px; height:6px; border-radius:50%; background: var(--purple); }
  .date-picker-wrap{ position:relative; }

  .calendar-panel{ position:absolute; top:calc(100% + 8px); left:0; z-index:50; width:290px; background: var(--card); border:1px solid var(--line-strong); border-radius:16px; padding:14px; box-shadow: 0 16px 40px rgba(0,0,0,0.45); }
  .calendar-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .calendar-header span{ font-size:13px; font-weight:700; text-transform:capitalize; }
  .calendar-nav{ width:30px; height:30px; border-radius:8px; background: var(--card-2); display:flex; align-items:center; justify-content:center; font-size:16px; color: var(--text-1); }
  .calendar-nav:hover{ background: var(--lime-dim); color: var(--lime); }
  .calendar-nav:disabled{ opacity:0.25; cursor:not-allowed; }
  .calendar-nav:disabled:hover{ background: var(--card-2); color: var(--text-1); }
  .calendar-weekdays{ display:grid; grid-template-columns: repeat(7, 1fr); text-align:center; font-size:10px; color: var(--text-2); font-weight:700; margin-bottom:4px; }
  .calendar-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:2px; }
  .cal-day{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:9px; font-size:12px; font-weight:600; color: var(--text-0); }
  .cal-day:hover:not(.cal-disabled):not(.cal-selected){ background: var(--card-2); }
  .cal-day.cal-outside{ color: var(--text-2); opacity:0.4; }
  .cal-day.cal-disabled{ color: var(--text-2); opacity:0.25; cursor:not-allowed; }
  .cal-day.cal-today{ border:1px solid var(--lime); }
  .cal-day.cal-selected{ background: linear-gradient(135deg, #C6FF3D, #7ED957); color:#0D2A0F; font-weight:800; }
  .calendar-footer{ display:flex; justify-content:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
  .calendar-quick{ font-size:12px; font-weight:700; color: var(--lime); }

  /* League pills */
  .filter-row{ display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding: 14px 0 20px; }
  .filter-row::-webkit-scrollbar{ display:none; }
  .live-filter-tab{ flex-shrink:0; display:flex; align-items:center; gap:7px; padding:9px 16px; border-radius:100px; background: var(--card); border:1px solid var(--line); font-size:12.5px; font-weight:700; color: var(--live); }
  .live-filter-tab .live-dot{ width:7px; height:7px; border-radius:50%; background: var(--live); animation: pulse 1.3s infinite; }
  .live-filter-tab.active{ background: var(--live); color:#fff; border-color:transparent; }
  .live-filter-tab.active .live-dot{ background:#fff; }

  .league-tab{ flex-shrink:0; display:flex; align-items:center; gap:7px; padding:9px 16px 9px 12px; border-radius:100px; background: var(--card); border:1px solid var(--line); font-size:12.5px; font-weight:600; color: var(--text-1); }
  .league-tab .flag{ width:15px; height:15px; display:flex; align-items:center; justify-content:center; font-size:9px; }
  .league-tab.active{ background: linear-gradient(135deg, var(--purple), #5B3FE0); color:#fff; border-color:transparent; font-weight:700; }

  /* Content grid */
  .content{ display:grid; grid-template-columns: 1fr 320px; gap:20px; align-items:start; }
  @media (max-width:880px){ .content{ grid-template-columns:1fr; } .side-col{ order:2; display:grid; grid-template-columns:1fr 1fr; gap:12px; } }
  @media (max-width:560px){ .side-col{ grid-template-columns:1fr; } }

  .league-group{ margin-bottom: var(--space-6); }
  .league-group-head{ display:flex; align-items:baseline; justify-content:space-between; padding-bottom:8px; margin-bottom:2px; border-bottom:1px solid var(--border-subtle); cursor:pointer; }
  .league-group-head .lg-name{ display:flex; align-items:center; gap:8px; font-family: var(--type-section-title-family); font-size:12px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color: var(--text-primary); }
  .league-group-head .lg-name .crest{ width:18px; height:18px; border-radius:6px; background: var(--purple-dim); color: var(--purple); display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:800; flex-shrink:0; }
  .league-group-head .lg-country{ font-size:10px; color: var(--text-2); font-weight:500; text-transform:uppercase; letter-spacing:.03em; }
  .side-card{ background: var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:16px; }
  .side-card h3{ font-family: var(--type-section-title-family); font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color: var(--text-2); margin-bottom:12px; }

  /* Match rows are now the canonical MatchRow component (Standard /
     Expanded density) from assets/components.css — see Pass 3A. The
     old .match-row/.m-status/.m-teams/.m-team/.t-name/.t-score/.m-fav/
     .fav-star/.odds-row/.odds-chip family is retired. */

  /* Sidebar direita */
  .side-card{ background: var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:16px; }
  .side-card h3{ font-size:14px; font-weight:700; margin-bottom:12px; }

  /* Standings table is now the canonical DataTable/StandingsTable
     component (.dt-row/.dt-zone/...) shared in assets/components.css —
     see Pass 3B. This also fixes the zone-color drift vs League/Team. */

  .top-scorer{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); }
  .top-scorer:last-child{ border-bottom:none; }
  .ts-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .ts-rank{ width:22px; height:22px; border-radius:8px; background: var(--card-2); font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ts-rank.top1{ background: var(--lime); color:#0D0B14; }
  .ts-name{ font-size:13px; font-weight:600; }
  .ts-club{ font-size:10.5px; color: var(--text-2); }
  .ts-goals{ font-weight:800; font-size:14px; color: var(--purple); flex-shrink:0; }

  .empty-note{ font-size:13px; color: var(--text-2); padding:16px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; }
  .empty-note .action{ color: var(--lime); font-weight:600; cursor:pointer; margin-top:2px; }

  @keyframes shimmer{ 0%{ background-position:-200% 0; } 100%{ background-position:200% 0; } }
  .skeleton{ background: linear-gradient(90deg, var(--card-2) 25%, var(--line-strong) 50%, var(--card-2) 75%); background-size:200% 100%; animation: shimmer 1.4s infinite linear; border-radius:10px; }
  .skeleton-row{ height:62px; margin:8px 16px; border-radius:14px; }
  .skeleton-line{ height:12px; margin:6px 0; border-radius:4px; }

  footer{ text-align:center; padding-top:24px; color: var(--text-2); font-size:10.5px; font-weight:600; letter-spacing:0.4px; text-transform:uppercase; }
</style>
</head>
<body>
<div class="app-shell">

  <!-- Sidebar (desktop) — canonical markup rendered by assets/shell.js, shared by all five pages -->
  <script>ApitoShell.renderSidebar();</script>

  <!-- Bottom navigation (mobile, persistent) — canonical markup rendered by assets/shell.js -->
  <script>ApitoShell.renderBottomNav();</script>

  <div class="main-area">
    <div class="shell">

      <!-- Topbar — canonical markup rendered by assets/shell.js; Home renders search+favorites inside it -->
      <script>ApitoShell.renderTopbar();</script>

      <div class="home-intro">
        <h1 class="home-title">Hoje no futebol</h1>
        <p class="home-context">
          <span class="home-date" id="home-date-label">A carregar...</span>
          <span class="sep">·</span>
          <span id="home-snapshot">a preparar o resumo do dia…</span>
        </p>
      </div>

      <div class="mr-rail" id="hero-carousel" style="display:none;"></div>

      <div class="toolbar">
        <div class="date-picker-wrap">
          <button class="date-pill date-pill-main" id="date-pill-btn" type="button" aria-haspopup="true" aria-expanded="false">
            <span class="dot"></span><span id="date-pill-label">Hoje</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;opacity:0.6;"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </button>
          <div class="calendar-panel" id="calendar-panel" style="display:none;">
            <div class="calendar-header">
              <button type="button" class="calendar-nav" id="cal-prev" aria-label="Mês anterior">‹</button>
              <span id="cal-mes-ano"></span>
              <button type="button" class="calendar-nav" id="cal-next" aria-label="Mês seguinte">›</button>
            </div>
            <div class="calendar-weekdays">
              <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
            </div>
            <div class="calendar-grid" id="cal-grid"></div>
            <div class="calendar-footer">
              <button type="button" class="calendar-quick" id="cal-hoje">Hoje</button>
            </div>
          </div>
        </div>
      </div>

      <div class="filter-row">
        <button class="live-filter-tab" id="live-filter-btn"><span class="live-dot"></span>Ao vivo</button>
        <div class="league-tab active" data-name="Todas"><span class="flag">🌍</span>Todas</div>
        <div class="league-tab" data-name="Liga Portugal"><span class="flag">🇵🇹</span>Liga Portugal</div>
        <div class="league-tab" data-name="Premier League"><span class="flag">🏴</span>Premier League</div>
        <div class="league-tab" data-name="La Liga"><span class="flag">🇪🇸</span>La Liga</div>
        <div class="league-tab" data-name="Serie A"><span class="flag">🇮🇹</span>Serie A</div>
        <div class="league-tab" data-name="Champions League"><span class="flag">⭐</span>Champions League</div>
      </div>

      <div class="content">
        <div class="main-col" id="main-col">
          <div class="skeleton skeleton-row"></div>
          <div class="skeleton skeleton-row"></div>
          <div class="skeleton skeleton-row"></div>
        </div>

        <div class="side-col">
          <div class="side-card" id="standings-card">
            <h3>Classificação</h3>
            <div class="skeleton skeleton-line" style="width:90%"></div>
            <div class="skeleton skeleton-line" style="width:75%"></div>
            <div class="skeleton skeleton-line" style="width:85%"></div>
          </div>
          <div class="side-card" id="scorers-card">
            <h3>Melhores marcadores</h3>
            <div class="skeleton skeleton-line" style="width:90%"></div>
            <div class="skeleton skeleton-line" style="width:75%"></div>
            <div class="skeleton skeleton-line" style="width:85%"></div>
          </div>
        </div>
      </div>

      <footer id="data-status" aria-live="polite" role="status">Dados de exemplo · a tentar ligar aos dados ao vivo...</footer>
    </div>
  </div>
</div>

<script>
  // Mostra qualquer erro JS diretamente na página (rodapé), sem precisar da consola
  window.addEventListener('error', (e) => {
    const el = document.getElementById('data-status');
    if (el) el.textContent = `⚠️ Erro JS: ${e.message} (${e.filename?.split('/').pop() || ''}:${e.lineno})`;
  });
  window.addEventListener('unhandledrejection', (e) => {
    const el = document.getElementById('data-status');
    if (el) el.textContent = `⚠️ Erro de promessa: ${e.reason?.message || e.reason}`;
  });

  // Theme state (get/set/toggle) is now fully owned by assets/shell.js —
  // it is shared, single-sourced behavior applied identically across all
  // five pages. See ApitoShell.toggleTheme().

  const FAV_KEY = 'apito-favoritos';
  const getFavs = () => JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
  const setFavs = (arr) => localStorage.setItem(FAV_KEY, JSON.stringify(arr));

  function paintFavStars(){
    document.querySelectorAll('.mr[data-teams]').forEach(row => {
      const teams = (row.dataset.teams || '').split(',');
      const star = row.querySelector('.mr-fav');
      if (!star) return;
      const isFav = teams.some(t => getFavs().includes(t));
      star.classList.toggle('active', isFav);
      star.setAttribute('aria-pressed', String(isFav));
    });
  }

  document.addEventListener('click', (e) => {
    const star = e.target.closest('.mr-fav');
    if (!star) return;
    e.stopPropagation();
    const row = star.closest('.mr[data-teams]');
    if (!row) return;
    const teams = (row.dataset.teams || '').split(',');
    let favs = getFavs();
    const already = teams.some(t => favs.includes(t));
    favs = already ? favs.filter(t => !teams.includes(t)) : [...new Set([...favs, ...teams])];
    setFavs(favs);
    paintFavStars();
    star.classList.remove('pop');
    void star.offsetWidth;
    star.classList.add('pop');
  });

  let onlyFavs = false;
  function alternarFavoritos(){
    onlyFavs = !onlyFavs;
    const favs = getFavs();
    document.querySelectorAll('.mr[data-teams]').forEach(row => {
      const teams = (row.dataset.teams || '').split(',');
      row.style.display = (onlyFavs && !teams.some(t => favs.includes(t))) ? 'none' : '';
    });
    [document.getElementById('fav-toggle'), document.getElementById('bn-favoritos'), document.getElementById('nav-favoritos')].filter(Boolean).forEach(el => {
      if (el) el.classList.toggle('active', onlyFavs);
      if (el && el.id === 'fav-toggle') el.style.color = onlyFavs ? 'var(--purple)' : '';
    });
  }

  paintFavStars();

  // #search-input is rendered by ApitoShell.renderTopbar() (assets/shell.js),
  // a different script than this one. Under normal load order it exists by
  // this point (the topbar mount script runs earlier in the document), but
  // this line is a cross-script dependency and must be guarded the same way
  // every other shell-injected element in this file already is (see
  // fav-toggle/bn-favoritos/nav-favoritos above) — a failed/slow shell.js
  // load must not throw and abort the rest of this script.
  const searchInput = document.getElementById('search-input');
  if (searchInput) searchInput.addEventListener('input', (e) => {
    const termo = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.mr[data-teams]').forEach(row => {
      const teams = (row.dataset.teams || '').toLowerCase();
      row.style.display = (!termo || teams.includes(termo)) ? '' : 'none';
    });
  });

  function leagueCrestImg(id, alt){
    if (!id) return `<span class="crest">${iniciais(alt)}</span>`;
    return `<img class="crest" src="https://sports.bzzoiro.com/img/league/${id}/?bg=transparent" alt="${alt}" width="20" height="20" style="object-fit:contain;border-radius:7px;" onerror="this.outerHTML='<span class=\\'crest\\'>${iniciais(alt)}</span>'">`;
  }
  function iniciais(nome){ return (nome||'?').split(' ').map(p=>p[0]).join('').slice(0,3).toUpperCase(); }

  // ---- Canonical MatchRow adapter ----
  // Maps this page's API shape onto the shared match object consumed by
  // ApitoComponents.matchRow (assets/components.js) — see Pass 3A.
  function paraMatchApito(j){
    return {
      id: j.id,
      status: j.estado,
      minute: j.minuto,
      kickoff: j.hora,
      home: { id: j.casa.id, name: j.casa.nome, goals: j.casa.golos },
      away: { id: j.fora.id, name: j.fora.nome, goals: j.fora.golos },
      odds: j.odds || null,
      favoriteKey: `${j.casa.nome},${j.fora.nome}`
    };
  }

  // Live-minute ticking now targets the canonical component's status text.
  setInterval(() => {
    document.querySelectorAll('.mr-status-text[data-base-min]').forEach(el => {
      const base = Number(el.dataset.baseMin);
      const desde = Date.now() - Number(el.dataset.renderedAt);
      const minutosPassados = Math.floor(desde / 60000);
      if (base + minutosPassados < 130) el.textContent = `${base + minutosPassados}'`;
    });
  }, 15000);

  function cartaoJogoHtml(j){
    const match = paraMatchApito(j);
    const density = (match.odds && (match.odds.casa || match.odds.empate || match.odds.fora)) ? 'expanded' : 'standard';
    const html = ApitoComponents.matchRow(match, { density });
    // Live-minute ticking hook (data-base-min/data-rendered-at), preserved
    // from V1: only meaningful while the match is actually live.
    if (j.estado === '1H') {
      return html.replace('<span class="mr-status-text">', `<span class="mr-status-text" data-base-min="${j.minuto ?? 0}" data-rendered-at="${Date.now()}">`);
    }
    return html;
  }

  function renderJogos(jogos){
    const mainCol = document.getElementById('main-col');
    if (!jogos.length){ mainCol.innerHTML = '<div class="empty-note">Sem jogos encontrados.</div>'; return; }
    const porLiga = {};
    jogos.forEach(j => {
      const chave = j.liga + '|' + j.pais;
      if (!porLiga[chave]) porLiga[chave] = [];
      porLiga[chave].push(j);
    });
    mainCol.innerHTML = Object.entries(porLiga).map(([chave, lista]) => {
      const [liga, pais] = chave.split('|');
      return `
        <div class="league-group">
          <div class="league-group-head" onclick="window.location.href='league.html?id=${lista[0]?.ligaId}'">
            <div class="lg-name">${leagueCrestImg(lista[0]?.ligaId, liga)}${liga}</div>
            <div class="lg-country">${pais}</div>
          </div>
          ${lista.map(cartaoJogoHtml).join('')}
        </div>`;
    }).join('');
    paintFavStars();

    const carousel = document.getElementById('hero-carousel');
    const todosAoVivo = jogos.filter(j => j.estado === '1H');
    if (todosAoVivo.length){
      carousel.style.display = 'flex';
      carousel.innerHTML = todosAoVivo.map(live => {
        const match = paraMatchApito(live);
        match.meta = live.liga; // shown in Expanded's metadata line instead of odds
        match.odds = null;
        // Genuinely live matches earn editorial emphasis via the FeaturedMatch
        // wrapper (gradient at the container level) — the MatchRow content
        // inside stays the same canonical, ungradiented Expanded component
        // used everywhere else. See Pass 3A correction 2.
        const html = ApitoComponents.featuredMatch(match);
        return html.replace('<span class="mr-status-text">', `<span class="mr-status-text" data-base-min="${live.minuto ?? 0}" data-rendered-at="${Date.now()}">`);
      }).join('');
    } else {
      carousel.style.display = 'none';
      carousel.innerHTML = '';
    }
  }


  function renderClassificacao(classificacao){
    const card = document.getElementById('standings-card');
    if (!classificacao.length) return;
    const linhas = classificacao.map(t => ApitoComponents.standingsRow(t)).join('');
    card.innerHTML = `
      <h3>Classificação</h3>
      ${ApitoComponents.standingsHeader()}
      ${linhas}`;
  }

  function renderMarcadores(marcadores){
    const card = document.getElementById('scorers-card');
    if (!marcadores.length) return;
    const linhas = marcadores.map((m,i) => `
      <div class="top-scorer">
        <div class="ts-left"><span class="ts-rank ${i===0?'top1':''}">${i+1}</span><div><div class="ts-name">${m.jogador}</div><div class="ts-club">${m.equipa}</div></div></div>
        <span class="ts-goals">${m.golos}</span>
      </div>`).join('');
    card.innerHTML = `<h3>Melhores marcadores</h3>${linhas}`;
  }

  const diaSemana = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const hoje = new Date();
  const offsets = Array.from({length:14}, (_,i) => i);
  const datasDosChips = offsets.map(o => { const d = new Date(hoje); d.setDate(d.getDate()+o); return d.toISOString().slice(0,10); });
  let dataAtiva = datasDosChips[0];

  const datePillLabel = document.getElementById('date-pill-label');
  const homeDateLabel = document.getElementById('home-date-label');
  function formatarDataPill(dataStr){
    const d = new Date(dataStr+'T12:00:00');
    const hojeStr = new Date().toISOString().slice(0,10);
    if (dataStr === hojeStr) return 'Hoje';
    return `${String(d.getDate()).padStart(2,'0')} ${d.toLocaleDateString('pt-PT',{weekday:'short',month:'short'})}`;
  }
  function formatarDataContexto(dataStr){
    const d = new Date(dataStr+'T12:00:00');
    const hojeStr = new Date().toISOString().slice(0,10);
    const amanhaStr = new Date(hoje.getTime() + 86400000).toISOString().slice(0,10);
    if (dataStr === hojeStr) return `Hoje, ${d.toLocaleDateString('pt-PT',{day:'numeric',month:'long'})}`;
    if (dataStr === amanhaStr) return `Amanhã, ${d.toLocaleDateString('pt-PT',{day:'numeric',month:'long'})}`;
    return d.toLocaleDateString('pt-PT',{weekday:'long',day:'numeric',month:'long'});
  }
  if (homeDateLabel) homeDateLabel.textContent = formatarDataContexto(dataAtiva);

  function atualizarResumoDia(jogos){
    const el = document.getElementById('home-snapshot');
    if (!el) return;
    if (!jogos || !jogos.length){
      el.textContent = apenasAoVivo ? 'sem jogos ao vivo neste momento' : 'sem jogos encontrados para este dia';
      return;
    }
    const emDireto = jogos.filter(j => j.estado === '1H').length;
    const competicoes = new Set(jogos.map(j => j.liga)).size;
    const partes = [];
    if (emDireto > 0) partes.push(`<span class="home-snapshot-num is-live">${emDireto}</span> em direto`);
    partes.push(`<span class="home-snapshot-num">${jogos.length}</span> jogo${jogos.length === 1 ? '' : 's'}`);
    partes.push(`<span class="home-snapshot-num">${competicoes}</span> competiç${competicoes === 1 ? 'ão' : 'ões'}`);
    el.innerHTML = partes.join(' · ');
  }

  // ---------- Calendário próprio (substitui o calendário nativo do browser) ----------
  try {
    const anoEpocaInicio = hoje.getMonth() >= 6 ? hoje.getFullYear() : hoje.getFullYear()-1;
    const limiteMin = new Date(`${anoEpocaInicio}-07-01T00:00:00`);
    const limiteMax = new Date(`${anoEpocaInicio+1}-06-30T00:00:00`);

    const painel = document.getElementById('calendar-panel');
    const botaoPill = document.getElementById('date-pill-btn');
    const grid = document.getElementById('cal-grid');
    const mesAnoLabel = document.getElementById('cal-mes-ano');
    const btnPrev = document.getElementById('cal-prev');
    const btnNext = document.getElementById('cal-next');
    const btnHoje = document.getElementById('cal-hoje');

    let mesVisivel = new Date(hoje.getFullYear(), hoje.getMonth(), 1);

    function mesmaData(a, b){
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
    }
    function paraISO(d){
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function desenharCalendario(){
      const nomeMes = mesVisivel.toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' });
      mesAnoLabel.textContent = nomeMes;

      const primeiroDiaSemana = new Date(mesVisivel.getFullYear(), mesVisivel.getMonth(), 1).getDay();
      const diasNoMes = new Date(mesVisivel.getFullYear(), mesVisivel.getMonth()+1, 0).getDate();
      const dataSelecionada = new Date(dataAtiva + 'T00:00:00');

      let html = '';
      // dias do mês anterior para preencher a grelha
      for (let i = 0; i < primeiroDiaSemana; i++){
        html += `<span class="cal-day cal-outside"></span>`;
      }
      for (let dia = 1; dia <= diasNoMes; dia++){
        const d = new Date(mesVisivel.getFullYear(), mesVisivel.getMonth(), dia);
        const fora = d < limiteMin || d > limiteMax;
        const selecionado = mesmaData(d, dataSelecionada);
        const ehHoje = mesmaData(d, hoje);
        const classes = ['cal-day'];
        if (fora) classes.push('cal-disabled');
        if (selecionado) classes.push('cal-selected');
        if (ehHoje && !selecionado) classes.push('cal-today');
        html += `<span class="${classes.join(' ')}" data-iso="${paraISO(d)}">${dia}</span>`;
      }
      grid.innerHTML = html;

      // desativa navegação para fora do intervalo da época
      const primeiroDoMesAnterior = new Date(mesVisivel.getFullYear(), mesVisivel.getMonth(), 0);
      const primeiroDoMesSeguinte = new Date(mesVisivel.getFullYear(), mesVisivel.getMonth()+1, 1);
      btnPrev.disabled = primeiroDoMesAnterior < limiteMin;
      btnNext.disabled = primeiroDoMesSeguinte > limiteMax;
    }

    function abrirCalendario(){
      mesVisivel = new Date(new Date(dataAtiva + 'T00:00:00').getFullYear(), new Date(dataAtiva + 'T00:00:00').getMonth(), 1);
      desenharCalendario();
      painel.style.display = 'block';
      botaoPill.setAttribute('aria-expanded', 'true');
    }
    function fecharCalendario(){
      painel.style.display = 'none';
      botaoPill.setAttribute('aria-expanded', 'false');
    }

    botaoPill.addEventListener('click', (e) => {
      e.stopPropagation();
      if (painel.style.display === 'block') fecharCalendario(); else abrirCalendario();
    });

    grid.addEventListener('click', (e) => {
      const alvo = e.target.closest('.cal-day');
      if (!alvo || alvo.classList.contains('cal-disabled') || alvo.classList.contains('cal-outside')) return;
      dataAtiva = alvo.dataset.iso;
      datePillLabel.textContent = formatarDataPill(dataAtiva);
      if (homeDateLabel) homeDateLabel.textContent = formatarDataContexto(dataAtiva);
      fecharCalendario();
      carregarJogos();
    });

    btnPrev.addEventListener('click', () => { mesVisivel.setMonth(mesVisivel.getMonth()-1); desenharCalendario(); });
    btnNext.addEventListener('click', () => { mesVisivel.setMonth(mesVisivel.getMonth()+1); desenharCalendario(); });
    btnHoje.addEventListener('click', () => {
      dataAtiva = datasDosChips[0];
      datePillLabel.textContent = 'Hoje';
      if (homeDateLabel) homeDateLabel.textContent = formatarDataContexto(dataAtiva);
      fecharCalendario();
      carregarJogos();
    });

    document.addEventListener('click', (e) => {
      if (painel.style.display === 'block' && !e.target.closest('.date-picker-wrap')) fecharCalendario();
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharCalendario(); });

  } catch (err) { console.error('Erro ao montar o calendário:', err); }

  const paisPorLiga = { 'Premier League':'England', 'La Liga':'Spain', 'Serie A':'Italy', 'Champions League':'Europe' };
  const termoPorLiga = { 'Premier League':'premier league', 'La Liga':'la liga', 'Serie A':'serie a', 'Champions League':'champions league' };
  const idsLiga = { 'Todas': null, 'Liga Portugal': 2 };
  const leagueTabs = document.querySelectorAll('.league-tab');
  let ligaAtiva = null; // "Todas" está ativa por defeito, por isso ligaAtiva começa sem filtro
  let apenasAoVivo = false;

  function alternarAoVivo(){
    apenasAoVivo = !apenasAoVivo;
    document.getElementById('live-filter-btn').classList.toggle('active', apenasAoVivo);
    document.getElementById('bn-ao-vivo')?.classList.toggle('active', apenasAoVivo);
    document.getElementById('nav-ao-vivo')?.classList.toggle('active', apenasAoVivo);
    carregarJogos();
  }
  try {
  } catch (err) { console.error('Erro ao montar o filtro Ao vivo:', err); }


  async function resolverIdLiga(nomeLiga){
    if (nomeLiga in idsLiga) return idsLiga[nomeLiga];
    const pais = paisPorLiga[nomeLiga];
    if (!pais) return null;
    try {
      const resp = await fetch(`/api/leagues?country=${encodeURIComponent(pais)}`);
      const data = await resp.json();
      const termo = termoPorLiga[nomeLiga];
      const encontrada = (data.results || []).find(l => l.name.toLowerCase().includes(termo));
      idsLiga[nomeLiga] = encontrada ? encontrada.id : null;
      return idsLiga[nomeLiga];
    } catch (err) { idsLiga[nomeLiga] = null; return null; }
  }

  try {
    leagueTabs.forEach(tab => {
      tab.addEventListener('click', async () => {
        leagueTabs.forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        const nomeLiga = tab.dataset.name;
        document.getElementById('data-status').textContent = 'A procurar a liga...';
        const idResolvido = await resolverIdLiga(nomeLiga);
        if (nomeLiga !== 'Todas' && idResolvido === null){
          ligaAtiva = 'nao-encontrada';
          document.getElementById('main-col').innerHTML = `<div class="empty-note">Não encontrámos "${nomeLiga}" na fonte de dados atual.</div>`;
          document.getElementById('data-status').textContent = `Liga "${nomeLiga}" não encontrada`;
          document.getElementById('standings-card').innerHTML = `<h3>Classificação</h3><div class="empty-note">Não disponível para esta liga.</div>`;
          document.getElementById('scorers-card').innerHTML = `<h3>Melhores marcadores</h3><div class="empty-note">Não disponível para esta liga.</div>`;
          return;
        }
        ligaAtiva = idResolvido;
        apenasAoVivo = false;
        document.getElementById('live-filter-btn').classList.remove('active');
        carregarJogos(); carregarClassificacao(); carregarMarcadores();
      });
    });
  } catch (err) { console.error('Erro ao montar as tabs de liga:', err); }

  const CACHE_KEY = 'apito-cache-jogos';
  function mostrarCacheImediata(){
    try {
      const cache = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (cache && cache.data === dataAtiva && cache.liga === ligaAtiva && Array.isArray(cache.jogos) && cache.jogos.length){
        renderJogos(cache.jogos);
        atualizarResumoDia(cache.jogos);
        document.getElementById('data-status').textContent = `A atualizar... (a mostrar dados de ${new Date(cache.quando).toLocaleTimeString('pt-PT')})`;
      }
    } catch (err) {}
  }

  async function carregarJogos(){
    const statusEl = document.getElementById('data-status');
    mostrarCacheImediata();
    if (statusEl.textContent === 'Dados de exemplo · a tentar ligar aos dados ao vivo...') statusEl.textContent = 'A carregar...';
    try {
      let url = `/api/live?date=${dataAtiva}`;
      if (ligaAtiva) url += `&league=${ligaAtiva}`;
      const resp = await fetch(url, { cache: 'no-store' });
      const data = await resp.json();
      if (!resp.ok || data.error) throw new Error(data.error || 'resposta não OK');
      let jogos = data.jogos || [];
      if (apenasAoVivo) jogos = jogos.filter(j => j.estado === '1H');
      if (!jogos.length){
        document.getElementById('main-col').innerHTML = `
          <div class="empty-note">
            ${apenasAoVivo ? 'Sem jogos ao vivo neste momento.' : 'Sem jogos encontrados para este dia/liga.'}
            <span class="action" onclick="document.getElementById('date-pill-btn').click()">Experimenta outra data →</span>
          </div>`;
        statusEl.textContent = 'API ligada · sem jogos para este filtro';
        atualizarResumoDia(jogos);
        return;
      }
      renderJogos(jogos);
      atualizarResumoDia(jogos);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ data: dataAtiva, liga: ligaAtiva, jogos, quando: Date.now() })); } catch (err) {}
      statusEl.textContent = `Dados ao vivo ligados · ${jogos.length} jogo(s) · atualizado ${new Date().toLocaleTimeString('pt-PT')}`;
    } catch (err) { statusEl.textContent = `Dados de exemplo · erro: ${err.message}`; }
  }

  async function carregarClassificacao(){
    const idParaClassificacao = ligaAtiva || 2;
    try {
      const resp = await fetch(`/api/standings?league=${idParaClassificacao}`, { cache: 'no-store' });
      const data = await resp.json();
      if (!resp.ok || data.error) throw new Error(data.error || 'resposta não OK');
      renderClassificacao(data.classificacao || []);
    } catch (err) {
      document.getElementById('standings-card').innerHTML = `<h3>Classificação</h3><div class="empty-note">Não disponível: ${err.message}</div>`;
    }
  }

  carregarJogos();
  carregarClassificacao();

  async function carregarMarcadores(){
    const idParaMarcadores = ligaAtiva || 2;
    try {
      const resp = await fetch(`/api/scorers?league=${idParaMarcadores}`, { cache: 'no-store' });
      const data = await resp.json();
      if (!resp.ok || data.error) throw new Error(data.error || 'resposta não OK');
      if (!data.marcadores || !data.marcadores.length) throw new Error('sem dados');
      renderMarcadores(data.marcadores);
    } catch (err) {
      document.getElementById('scorers-card').innerHTML = `<h3>Melhores marcadores</h3><div class="empty-note">Não disponível de momento</div>`;
    }
  }
  // Listener único e delegado no document para os botões de navegação/filtro.
  // Isto garante que continuam a funcionar mesmo que a página seja re-desenhada
  // depois de os dados carregarem (o mesmo padrão já usado nas estrelas de favoritos).
  // Nota: o toggle de tema (#theme-toggle / #nav-tema / #bn-tema) já não é tratado
  // aqui — é responsabilidade única de assets/shell.js em todas as páginas.
  document.addEventListener('click', (e) => {
    if (e.target.closest('#fav-toggle') || e.target.closest('#nav-favoritos') || e.target.closest('#bn-favoritos')){
      alternarFavoritos();
      return;
    }
    if (e.target.closest('#live-filter-btn') || e.target.closest('#nav-ao-vivo') || e.target.closest('#bn-ao-vivo')){
      alternarAoVivo();
      return;
    }
    if (e.target.closest('#nav-inicio') || e.target.closest('#bn-inicio')){
      window.scrollTo({top:0, behavior:'smooth'});
      return;
    }
  });

  carregarMarcadores();
  setInterval(carregarJogos, 60000);

  // Se chegámos aqui a partir de "Ao vivo" ou "Favoritos" noutra página, aplica esse filtro assim que os jogos carregarem
  (function aplicarFiltroDaURL(){
    const filtro = new URLSearchParams(location.search).get('filtro');
    if (filtro !== 'ao-vivo' && filtro !== 'favoritos') return;
    const esperar = setInterval(() => {
      if (document.querySelectorAll('.mr').length || document.querySelector('.empty-note')){
        clearInterval(esperar);
        if (filtro === 'ao-vivo') alternarAoVivo();
        if (filtro === 'favoritos') alternarFavoritos();
      }
    }, 200);
    setTimeout(() => clearInterval(esperar), 5000); // desiste ao fim de 5s para não ficar preso
  })();
</script>
</body>
</html>
